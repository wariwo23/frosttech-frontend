"use strict";

/*
 * Use the client created by supabase.js.
 * Do not create a second Supabase client here.
 */
const supabaseClient = window.supabaseClient;

/* Display errors clearly on the page. */
function showPageError(message) {
  const status = document.getElementById("product-status");

  if (status) {
    status.textContent = message;
  }
}

/* Load and display the selected product. */
async function loadProduct() {
  const productDetails =
    document.getElementById("product-details");

  const productStatus =
    document.getElementById("product-status");

  if (!window.supabase || !window.supabase.createClient) {
    showPageError(
      "Supabase library failed to load. Please refresh the page and try again."
    );
    console.error("Supabase JavaScript library is unavailable.");
    return;
  }

  if (!supabaseClient) {
    showPageError(
      "Supabase client not found. Please check supabase.js and confirm that window.supabaseClient is configured."
    );
    console.error("window.supabaseClient is unavailable.");
    return;
  }

  const params =
    new URLSearchParams(window.location.search);

  const productId =
    params.get("id");

  if (!productId) {
    productStatus.textContent =
      "No product was selected. Please return to the Products page and select a product.";
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        category,
        brand,
        model,
        description,
        selling_price,
        stock_quantity,
        image_url
      `)
      .eq("id", productId)
      .eq("is_active", true)
      .single();

    if (error) {
      console.error("Product loading error:", error);

      productStatus.textContent =
        error.code === "PGRST116"
          ? "This product was not found or is no longer available."
          : "Unable to load product. Please try again later.";

      return;
    }

    if (!data) {
      productStatus.textContent =
        "This product is currently unavailable.";
      return;
    }

    productStatus.remove();

    productDetails.innerHTML = `
      <div class="product-detail-card">

        <div class="product-detail-image">
          ${
            data.image_url
              ? `<img
                   src="${escapeHTML(data.image_url)}"
                   alt="${escapeHTML(data.name || "HVAC product")}">`
              : "❄"
          }
        </div>

        <div class="product-detail-info">

          <p class="small-title">
            ${escapeHTML(data.category || "HVAC PRODUCT")}
          </p>

          <h1>${escapeHTML(data.name || "Product")}</h1>

          <p>
            <strong>Brand:</strong>
            ${escapeHTML(data.brand || "Not specified")}
          </p>

          <p>
            <strong>Model:</strong>
            ${escapeHTML(data.model || "Not specified")}
          </p>

          <p>
            ${escapeHTML(data.description || "No description available.")}
          </p>

          <h2>
            ₦${Number(data.selling_price || 0).toLocaleString("en-NG")}
          </h2>

          <p>
            ${
              Number(data.stock_quantity || 0) > 0
                ? "In Stock"
                : "Currently unavailable"
            }
          </p>

          <div class="hero-buttons">

            <button
              type="button"
              class="primary-btn"
              id="request-quote-button">
              Request a Quote
            </button>

            <button
              type="button"
              class="secondary-btn"
              id="whatsapp-button">
              WhatsApp
            </button>

          </div>

        </div>
      </div>
    `;

    document
      .getElementById("request-quote-button")
      .addEventListener("click", function () {
        showQuoteForm(data);
      });

    document
      .getElementById("whatsapp-button")
      .addEventListener("click", function () {
        contactWhatsApp(data.name);
      });

  } catch (error) {
    console.error("Unexpected product loading error:", error);

    productStatus.textContent =
      "An unexpected error occurred while loading this product. Please refresh and try again.";
  }
}

/* Escape text before displaying database values in HTML. */
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function (character) {
    const replacements = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };

    return replacements[character];
  });
}

/* Display the customer quote request form. */
function showQuoteForm(product) {
  const productDetails =
    document.getElementById("product-details");

  const existingForm =
    document.getElementById("quote-form-box");

  if (existingForm) {
    existingForm.scrollIntoView({ behavior: "smooth" });
    return;
  }

  const formBox =
    document.createElement("div");

  formBox.id = "quote-form-box";
  formBox.className = "quote-form-box";

  formBox.innerHTML = `
    <h2>Request a Quote</h2>

    <p>
      Request a quotation for
      <strong>${escapeHTML(product.name)}</strong>
    </p>

    <form id="quote-form">

      <input
        type="text"
        id="customer-name"
        placeholder="Your full name"
        autocomplete="name"
        required>

      <input
        type="tel"
        id="customer-phone"
        placeholder="Phone / WhatsApp number"
        autocomplete="tel"
        required>

      <input
        type="number"
        id="quantity"
        placeholder="Quantity"
        min="1"
        value="1"
        required>

      <input
        type="number"
        id="budget"
        placeholder="Your budget (₦)"
        min="0">

      <input
        type="text"
        id="delivery-address"
        placeholder="Delivery address"
        autocomplete="street-address"
        required>

      <textarea
        id="description"
        placeholder="Additional requirements"
        rows="5"></textarea>  <button
    type="submit"
    class="primary-btn">
    Submit Quote Request
  </button>

</form>

<p id="quote-message" role="status" aria-live="polite"></p>

`;

productDetails.appendChild(formBox);

document
  .getElementById("quote-form")
  .addEventListener("submit", async function (event) {
    event.preventDefault();

    const message = document.getElementById("quote-message");

    message.textContent = "Button works. Processing your request...";

    console.log("Quote form submitted.");

    try {
      await submitQuoteRequest(product);
    } catch (error) {
      console.error("Quote submission failed:", error);

      message.textContent =
        "Error: " + (error.message || "Please try again.");
    }
  });

formBox.scrollIntoView({ behavior: "smooth" });
}

/* Submit the quote request to Supabase. */
async function submitQuoteRequest(product) {
const message =
document.getElementById("quote-message");

const form =
document.getElementById("quote-form");

const submitButton =
form.querySelector('button[type="submit"]');

if (!supabaseClient) {
message.textContent =
"Unable to submit request because the database connection is unavailable.";
return;
}

const name =
document.getElementById("customer-name").value.trim();

const phone =
document.getElementById("customer-phone").value.trim();

const quantity =
Number(document.getElementById("quantity").value);

const budgetValue =
document.getElementById("budget").value;

const budget =
budgetValue ? Number(budgetValue) : null;

const deliveryAddress =
document.getElementById("delivery-address").value.trim();

const description =
document.getElementById("description").value.trim();

if (!name || !phone || !deliveryAddress || quantity < 1) {
message.textContent =
"Please complete all required fields and enter a valid quantity.";
return;
}

message.textContent = "Submitting your request...";
submitButton.disabled = true;

const requestNumber =
"FT-" + Date.now();

try {
const { error } = await supabaseClient
.from("quote_requests")
.insert({
request_number: requestNumber,

    title:
      "Quote Request - " + product.name,

    description:
      "Customer: " + name +
      "\nPhone: " + phone +
      "\nProduct: " + product.name +
      "\nRequirements: " + description,

    product_id: product.id,
    quantity: quantity,
    preferred_brand: product.brand || null,
    budget: budget,
    delivery_address: deliveryAddress,
    status: "pending"
  });

if (error) {
  console.error("Quote request submission error:", error);

  message.textContent =
    "Unable to submit request: " + error.message;

  return;
}

message.textContent =
  "Quote request submitted successfully! Reference number: " +
  requestNumber +
  ". Please keep this number for your records.";

form.reset();

} catch (error) {
console.error("Unexpected quote submission error:", error);

message.textContent =
  "A connection error occurred. Please try again.";

} finally {
submitButton.disabled = false;
}
}

/* Open WhatsApp with the selected product name. */
function contactWhatsApp(productName) {
const message =
"Hello FrostTech, I am interested in: " + productName;

const url =
"https://wa.me/2348032008635?text=" +
encodeURIComponent(message);

window.open(url, "_blank", "noopener,noreferrer");
}

/* Start the product page. */
loadProduct();
</script>
