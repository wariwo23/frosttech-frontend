<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | FrostTech HVAC and Refrigeration</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

<header class="topbar">
  <div class="container nav">

    <div class="logo">
      <span>❄</span> FrostTech
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#categories">Categories</a>
      <a href="index.html#products">Products</a>
      <a href="index.html#quote">Request Quote</a>
    </nav>

  </div>
</header>

<main>

  <section class="section">

    <div class="container">

      <p>
        <a href="index.html#products">← Back to Products</a>
      </p>

      <div id="product-details">

        <p id="product-status">
          Loading product...
        </p>

      </div>

    </div>

  </section>

</main>

<footer>

  <div class="container footer-content">

    <div>
      <h2>❄ FrostTech</h2>
      <p>HVAC and Refrigeration Marketplace</p>
    </div>

    <div>
      <p>Website: frosttechonline.com</p>
      <p>WhatsApp: +234 803 200 8635</p>
    </div>

  </div>

  <div class="copyright">
    © 2026 FrostTech HVAC and Refrigeration. All rights reserved.
  </div>

</footer>

<script>

async function loadProduct() {

  const productDetails =
    document.getElementById("product-details");

  const productStatus =
    document.getElementById("product-status");

  const params =
    new URLSearchParams(window.location.search);

  const productId =
    params.get("id");

  if (!productId) {

    productStatus.textContent =
      "No product was selected.";

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        category,
        brand,
        model,
        description,
        selling_price,
        stock_quantity,
        image_url
      `)
      .eq("id", productId)
      .eq("is_active", true)
      .single();

  if (error) {

    productStatus.textContent =
      "Unable to load product: " +
      error.message;

    return;
  }

  productStatus.remove();

  productDetails.innerHTML = `

    <div class="product-detail-card">

      <div class="product-detail-image">

        ${
          data.image_url
            ? `<img src="${data.image_url}" alt="${data.name}">`
            : "❄"
        }

      </div>

      <div class="product-detail-info">

        <p class="small-title">
          ${data.category || "HVAC PRODUCT"}
        </p>

        <h1>
          ${data.name}
        </h1>

        <p>
          <strong>Brand:</strong>
          ${data.brand || "Not specified"}
        </p>

        <p>
          <strong>Model:</strong>
          ${data.model || "Not specified"}
        </p>

        <p>
          ${data.description || "No description available."}
        </p>

        <h2>
          ₦${Number(
            data.selling_price || 0
          ).toLocaleString()}
        </h2>

        <p>
          ${
            Number(data.stock_quantity || 0) > 0
              ? "In Stock"
              : "Currently unavailable"
          }
        </p>

        <div class="hero-buttons">

          <button
            class="primary-btn"
            onclick="requestQuote('${data.id}')">
            Request a Quote
          </button>

          <button
            class="secondary-btn"
            onclick="contactWhatsApp('${data.name}')">
            WhatsApp
          </button>

        </div>

      </div>

    </div>

  `;
}


function requestQuote(productId) {

  const productDetails =
    document.getElementById("product-details");

  productDetails.innerHTML += `

    <div class="quote-form-box">

      <h2>Request a Quote</h2>

      <p>
        Please provide your details and requirements.
      </p>

      <form id="quote-form">

        <input
          type="text"
          id="customer-name"
          placeholder="Your full name"
          required
        >

        <input
          type="tel"
          id="customer-phone"
          placeholder="Phone / WhatsApp number"
          required
        >

        <input
          type="number"
          id="quantity"
          placeholder="Quantity"
          min="1"
          value="1"
          required
        >

        <input
          type="number"
          id="budget"
          placeholder="Your budget (₦)"
          min="0"
        >

        <input
          type="text"
          id="delivery-address"
          placeholder="Delivery address"
          required
        >

        <textarea
          id="description"
          placeholder="Additional requirements"
          rows="5">
        </textarea>

        <button
          type="submit"
          class="primary-btn">
          Submit Quote Request
        </button>

      </form>

      <p id="quote-message"></p>

    </div>

  `;

  document
    .getElementById("quote-form")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      submitQuoteRequest(productId);

    });

}
async function submitQuoteRequest(productId) {

  const message =
    document.getElementById("quote-message");

  const name =
    document.getElementById("customer-name").value.trim();

  const phone =
    document.getElementById("customer-phone").value.trim();

  const quantity =
    Number(document.getElementById("quantity").value);

  const budgetValue =
    document.getElementById("budget").value;

  const budget =
    budgetValue ? Number(budgetValue) : null;

  const deliveryAddress =
    document.getElementById("delivery-address").value.trim();

  const description =
    document.getElementById("description").value.trim();


  message.textContent =
    "Submitting your request...";


  const { data: product, error: productError } =
    await supabaseClient
      .from("products")
      .select("name, brand")
      .eq("id", productId)
      .single();


  if (productError) {

    message.textContent =
      "Unable to find the selected product.";

    return;
  }


  const requestNumber =
    "FT-" +
    Date.now();


  const { error } =
    await supabaseClient
      .from("quote_requests")
      .insert({

        request_number: requestNumber,

        title:
          "Quote Request - " +
          product.name,

        description:
          "Customer: " +
          name +
          "\nPhone: " +
          phone +
          "\nProduct: " +
          product.name +
          "\n" +
          description,

        product_id: productId,

        quantity: quantity,

        preferred_brand:
          product.brand || null,

        budget: budget,

        delivery_address:
          deliveryAddress,

        status: "pending"

      });


  if (error) {

    console.error(error);

    message.textContent =
      "Unable to submit request: " +
      error.message;

    return;
  }


  message.textContent =
    "Quote request submitted successfully! " +
    "Reference: " +
    requestNumber;

  document
    .getElementById("quote-form")
    .reset();

}
}


function contactWhatsApp(productName) {

  const message =
    "Hello FrostTech, I am interested in: " +
    productName;

  const url =
    "https://wa.me/2348032008635?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");

}


loadProduct();

</script>

</body>
</html>
