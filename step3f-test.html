<!DOCTYPE html><html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostTech Step 3F</title>
</head><body><h1>FrostTech Step 3F</h1><p><strong>Select Supplier Quotation</strong></p><button type="button" id="loadQuoteBtn">
    Load Supplier Quote
</button><div id="result" style="margin-top:20px;">
    Waiting for test...
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
    "https://nftxptjpgidcsgtaltjn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";

const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* Known supplier quotation selected in Step 3E */
const SUPPLIER_QUOTE_ID =
    "703982c3-b94f-4a8a-8702-a35fc1192523";


async function loadSupplierQuote() {

    const result = document.getElementById("result");

    result.innerHTML = "Loading selected supplier quotation...";

    try {

        const { data, error } = await supabaseClient
            .from("supplier_quotes")
            .select(`
                id,
                request_id,
                supplier_id,
                product_id,
                quantity,
                supplier_unit_price,
                supplier_total,
                delivery_cost,
                frosttech_margin_percent,
                frosttech_margin_amount,
                customer_total,
                notes,
                valid_until,
                status,
                customer_quote_status,
                created_at,
                updated_at
            `)
            .eq("id", SUPPLIER_QUOTE_ID)
            .eq("status", "selected")
            .single();

        if (error) {
            throw error;
        }

        if (!data) {
            result.innerHTML =
                "<strong>No selected supplier quotation found.</strong>";
            return;
        }

        result.innerHTML = `

            <h2>Selected Supplier Quotation</h2>

            <p>
                <strong>Quote ID:</strong><br>
                ${data.id}
            </p>

            <p>
                <strong>Request ID:</strong><br>
                ${data.request_id}
            </p>

            <p>
                <strong>Supplier ID:</strong><br>
                ${data.supplier_id}
            </p>

            <p>
                <strong>Product ID:</strong><br>
                ${data.product_id}
            </p>

            <p>
                <strong>Quantity:</strong>
                ${data.quantity}
            </p>

            <p>
                <strong>Supplier Unit Price:</strong>
                ₦${Number(data.supplier_unit_price).toLocaleString()}
            </p>

            <p>
                <strong>Supplier Total:</strong>
                ₦${Number(data.supplier_total).toLocaleString()}
            </p>

            <p>
                <strong>Delivery Cost:</strong>
                ₦${Number(data.delivery_cost).toLocaleString()}
            </p>

            <p>
                <strong>FrostTech Margin:</strong>
                ${data.frosttech_margin_percent}%
            </p>

            <p>
                <strong>FrostTech Margin Amount:</strong>
                ₦${Number(data.frosttech_margin_amount).toLocaleString()}
            </p>

            <p>
                <strong>Customer Total:</strong>
                ₦${Number(data.customer_total).toLocaleString()}
            </p>

            <p>
                <strong>Status:</strong>
                ${data.status}
            </p>

            <p>
                <strong>Customer Quote Status:</strong>
                ${data.customer_quote_status}
            </p>

            <hr>

            <h3>STEP 3F SUCCESS</h3>

            <p>
                The selected supplier quotation has been loaded successfully.
            </p>
        `;

    } catch (error) {

        result.innerHTML = `
            <h3>STEP 3F ERROR</h3>
            <p>${error.message}</p>
        `;

        console.error(error);
    }
}


document
    .getElementById("loadQuoteBtn")
    .addEventListener("click", loadSupplierQuote);

</script></body>
</html>
