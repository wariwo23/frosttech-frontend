<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrostTech Secure Payment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #183153;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
    }
    h1 { color: #0755a5; }
    .amount {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0755a5;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }
    button:disabled { opacity: 0.6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FrostTech HVAC and Refrigeration</h1>
    <h2>Order Payment</h2>

    <p>Order number: FT-ORD-cc57bf9c9f0c</p>
    <p>Order total:</p>
    <div class="amount">₦125,000.00</div>

    <p>Continue to Paystack to complete your payment securely.</p>

    <button id="payButton" type="button" onclick="startPayment()">
      Continue to Payment
    </button>

    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://nftxptjpgidcsgtaltjn.supabase.co";

    // Paste the public/publishable key from your supabase.js file.
    // Never use the service-role key here.
    const SUPABASE_PUBLIC_KEY = "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const ORDER_ID = "4ebdc043-9878-4147-bec5-edcfc4207ead";

    window.startPayment = async function () {
      const button = document.getElementById("payButton");
      const message = document.getElementById("message");

      button.disabled = true;
      message.textContent = "Preparing your payment...";

      try {
        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        const session = sessionData.session;

        if (!session) {
          message.textContent =
            "Please sign in to your FrostTech account before paying.";
          button.disabled = false;
          return;
        }

        const response = await fetch(
          SUPABASE_URL +
          "/functions/v1/initialize-paystack-payment",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_PUBLIC_KEY,
              "Authorization": "Bearer " + session.access_token
            },
            body: JSON.stringify({
              order_id: ORDER_ID
            })
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message || "Payment initialization failed."
          );
        }

        if (!result.authorization_url) {
          throw new Error("Paystack did not return a payment link.");
        }

        message.textContent = "Opening Paystack...";
        window.location.href = result.authorization_url;

      } catch (error) {
        message.textContent = "Payment could not start: " + error.message;
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
