<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FrostTech Secure Payment</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 20px;
      color: #172033;
    }

    .container {
      max-width: 520px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #075985;
      font-size: 25px;
    }

    p {
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccd5e0;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 7px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #8795a5;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .info {
      background: #e8f3ff;
    }

    .success {
      background: #e3f8e9;
      color: #14532d;
    }

    .error {
      background: #fee8e7;
      color: #991b1b;
    }

    .hidden {
      display: none;
    }

    .small {
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>FrostTech Secure Payment</h1>

    <p>
      Use this page to pay for an existing FrostTech order
      through Paystack.
    </p>

    <div id="message" class="info" role="status" aria-live="polite">
      Checking your payment session...
    </div>

    <form id="paymentForm" class="hidden">
      <label for="orderId">FrostTech Order ID</label>

      <input
        id="orderId"
        type="text"
        placeholder="Enter your order UUID"
        autocomplete="off"
        required
      >

      <button id="payButton" type="submit">
        Continue to Paystack
      </button>
    </form>

    <p class="small">
      Payments are verified by FrostTech's server.
      Do not share your login credentials or payment details.
    </p>
  </main>

  <!-- Load the Supabase JavaScript library first. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Load your existing FrostTech Supabase configuration. -->
  <script src="supabase.js"></script>

  <script>
    const FUNCTION_BASE =
      "https://nftxptjpgidcsgtaltjn.supabase.co/functions/v1";

    const PUBLISHABLE_KEY =
      "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";

    const messageBox = document.getElementById("message");
    const paymentForm = document.getElementById("paymentForm");
    const orderIdInput = document.getElementById("orderId");
    const payButton = document.getElementById("payButton");

    const supabaseClient = window.supabaseClient;

    function showMessage(message, type = "info") {
      messageBox.textContent = message;
      messageBox.className = type;
    }

    function validUUID(value) {
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
        .test(value);
    }

    async function getAccessToken() {
      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        throw new Error("Unable to check your login session.");
      }

      if (!session || !session.access_token) {
        throw new Error(
          "Please sign in to your FrostTech customer account before continuing."
        );
      }

      return session.access_token;
    }

    async function callPaymentFunction(functionName, payload) {
      const token = await getAccessToken();

      const response = await fetch(
        `${FUNCTION_BASE}/${functionName}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": PUBLISHABLE_KEY,
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        }
      );

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result.error || "The payment service returned an error."
        );
      }

      return result;
    }

    async function verifyReturnedPayment() {
      const params = new URLSearchParams(window.location.search);

      const reference =
        params.get("reference") ||
        params.get("trxref");

      if (!reference) {
        return false;
      }

      paymentForm.classList.add("hidden");

      showMessage(
        "Checking your transaction with Paystack. Please wait..."
      );

      try {
        const result = await callPaymentFunction(
          "verify-paystack-payment",
          { reference }
        );

        if (result.success) {
          showMessage(
            "Payment verified successfully.\n\n" +
            "Payment ID: " + (result.payment_id || "Recorded") +
            "\nOrder ID: " + (result.order_id || "Not provided") +
            "\nStatus: " + (result.payment_status || "Already verified"),
            "success"
          );

          // Remove the transaction reference from the address bar.
          // The payment reference remains in the database.
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );

          return true;
        }

        throw new Error(
          result.message || "The payment has not been confirmed."
        );
      } catch (error) {
        showMessage(
          "Payment verification could not be completed.\n\n" +
          error.message +
          "\n\nDo not pay again. Please contact FrostTech to check the transaction.",
          "error"
        );

        return true;
      }
    }

    paymentForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const orderId = orderIdInput.value.trim();

      if (!validUUID(orderId)) {
        showMessage(
          "Enter a valid FrostTech order ID.",
          "error"
        );
        return;
      }

      payButton.disabled = true;
      payButton.textContent = "Connecting to Paystack...";

      try {
        showMessage("Preparing your secure payment...");

        const result = await callPaymentFunction(
          "initialize-paystack-payment",
          { order_id: orderId }
        );

        if (!result.success || !result.authorization_url) {
          throw new Error(
            result.error || "Paystack checkout could not be started."
          );
        }

        showMessage("Opening Paystack secure checkout...");

        window.location.assign(result.authorization_url);
      } catch (error) {
        showMessage(
          error.message || "Unable to initialize payment.",
          "error"
        );

        payButton.disabled = false;
        payButton.textContent = "Continue to Paystack";
      }
    });

    async function initializePage() {
      if (!supabaseClient) {
        showMessage(
          "Supabase client not found. Check supabase.js.",
          "error"
        );
        return;
      }

      try {
        await getAccessToken();

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("order_id");

        if (orderId && validUUID(orderId)) {
          orderIdInput.value = orderId;
        }

        const returnedFromPaystack =
          await verifyReturnedPayment();

        if (!returnedFromPaystack) {
          showMessage(
            "You are signed in. Enter your existing order ID to continue."
          );

          paymentForm.classList.remove("hidden");
        }
      } catch (error) {
        showMessage(
          error.message ||
          "Please sign in to your FrostTech customer account.",
          "error"
        );
      }
    }

    initializePage();
  </script>
</body>
</html>
