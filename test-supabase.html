<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrostTech Supabase Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <h1>FrostTech Supabase Test</h1>

  <p id="status">Testing database connection...</p>

  <script>
    const status = document.getElementById("status");

    async function testConnection() {

      if (!supabaseClient) {
        status.textContent = "Supabase client failed to load.";
        return;
      }

      const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .limit(1);

      if (error) {
  status.textContent =
    "Database connection error: " +
    error.message +
    " | Code: " +
    (error.code || "none") +
    " | Details: " +
    (error.details || "none");
} else {
        status.textContent = "FrostTech Supabase database connected successfully!";
      }
    }

    testConnection();
  </script>

</body>
</html>
