<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Login | FrostTech</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #183153;
      margin: 0;
      padding: 25px 15px;
    }

    .container {
      max-width: 430px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      color: #0755a5;
      text-align: center;
      font-size: 25px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
    }

    p {
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 6px;
      background: #0755a5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #e2e8f0;
      color: #183153;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>FrostTech</h1>

    <p style="text-align:center">
      HVAC and Refrigeration Marketplace
    </p>

    <h2 id="formTitle">Customer Login</h2>

    <p>
      Sign in to your FrostTech account to continue with your order.
    </p>

    <form id="authForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        autocomplete="email"
        required
        placeholder="Enter your email"
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
        minlength="6"
        placeholder="Enter your password"
      >

      <button id="submitButton" type="submit">
        Sign In
      </button>

    </form>

    <button
      id="toggleButton"
      class="secondary"
      type="button"
    >
      Create a New Account
    </button>

    <button
      id="resetButton"
      class="secondary"
      type="button"
    >
      Forgot Password?
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="footer">
      <a href="index.html">Return to FrostTech Homepage</a>
    </div>

  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://nftxptjpgidcsgtaltjn.supabase.co";

    // Replace this placeholder with the public/publishable
    // key already used in your FrostTech supabase.js file.
    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const form = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const toggleButton = document.getElementById("toggleButton");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");
    const formTitle = document.getElementById("formTitle");

    let createAccountMode = false;

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#b91c1c" : "#166534";
    }

    toggleButton.addEventListener("click", () => {
      createAccountMode = !createAccountMode;

      formTitle.textContent = createAccountMode
        ? "Create Customer Account"
        : "Customer Login";

      submitButton.textContent = createAccountMode
        ? "Create Account"
        : "Sign In";

      toggleButton.textContent = createAccountMode
        ? "Return to Login"
        : "Create a New Account";

      passwordInput.autocomplete = createAccountMode
        ? "new-password"
        : "current-password";

      showMessage("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      toggleButton.disabled = true;

      showMessage(
        createAccountMode
          ? "Creating your account..."
          : "Signing you in..."
      );

      try {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (createAccountMode) {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo:
                "https://wariwo23.github.io/frosttech-frontend/customer-login.html"
            }
          });

          if (error) throw error;

          if (data.session) {
            showMessage("Account created. Opening your order...");

            window.location.href = "payment.html";
            return;
          }

          showMessage(
            "Account created. Check your email to confirm your account, then return here and sign in."
          );

        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showMessage("Login successful. Opening your order...");

          window.location.href = "payment.html";
          return;
        }

      } catch (error) {
        showMessage(
          error.message || "Something went wrong. Please try again.",
          true
        );

      } finally {
        submitButton.disabled = false;
        toggleButton.disabled = false;
      }
    });

    resetButton.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Enter your email address first, then tap Forgot Password again.",
          true
        );
        return;
      }

      resetButton.disabled = true;

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://wariwo23.github.io/frosttech-frontend/customer-login.html"
          }
        );

        if (error) throw error;

        showMessage(
          "If the account exists, a password reset email will be sent."
        );

      } catch (error) {
        showMessage(
          error.message || "Could not request a password reset.",
          true
        );

      } finally {
        resetButton.disabled = false;
      }
    });
  </script>

</body>
</html>
