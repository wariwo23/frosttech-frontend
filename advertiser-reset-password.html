
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advertiser Password Reset | FrostTech</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:18px;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#183153;
}

.card{
    width:100%;
    max-width:460px;
    margin:35px auto;
    padding:26px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 18px #0001;
}

.brand{text-align:center;margin-bottom:24px}

.brand h1{
    margin:0;
    color:#087f8c;
    font-size:28px;
}

.brand p{
    color:#64748b;
    font-size:14px;
}

h2{
    text-align:center;
    font-size:22px;
}

.help{
    text-align:center;
    color:#64748b;
    font-size:14px;
    line-height:1.6;
}

label{
    display:block;
    margin:17px 0 7px;
    font-size:14px;
    font-weight:600;
}

.password-row{
    display:flex;
    gap:8px;
}

input{
    width:100%;
    min-width:0;
    min-height:46px;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:7px;
    font-size:16px;
}

.toggle{
    padding:8px 12px;
    border:1px solid #087f8c;
    border-radius:7px;
    background:white;
    color:#087f8c;
}

button{
    cursor:pointer;
    font-family:inherit;
}

.primary{
    width:100%;
    min-height:46px;
    margin-top:20px;
    padding:12px;
    border:0;
    border-radius:7px;
    background:#087f8c;
    color:white;
    font-size:15px;
    font-weight:600;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin:15px 0;
    padding:12px;
    border-radius:7px;
    font-size:14px;
    line-height:1.5;
    overflow-wrap:anywhere;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.back{
    display:block;
    width:fit-content;
    margin:20px auto 0;
    color:#087f8c;
    font-size:14px;
}

.hidden{display:none!important}

@media(max-width:480px){
    .card{margin:16px auto;padding:22px 18px}
}
</style>
</head>

<body>

<main class="card">

<header class="brand">
    <h1>FrostTech</h1>
    <p>HVAC and Refrigeration Advertising Marketplace</p>
</header>

<div id="message" class="message"
     role="status" aria-live="polite"></div>

<section id="passwordSection" class="hidden">

    <h2>Choose a New Password</h2>

    <p class="help">
        Enter and confirm your new advertiser account password.
        Your password must contain at least 8 characters.
    </p>

    <form id="passwordForm">

        <label for="newPassword">New Password</label>

        <div class="password-row">
            <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
                placeholder="At least 8 characters"
            >
            <button type="button" class="toggle"
                    data-target="newPassword">Show</button>
        </div>

        <label for="confirmPassword">Confirm New Password</label>

        <div class="password-row">
            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
                placeholder="Enter password again"
            >
            <button type="button" class="toggle"
                    data-target="confirmPassword">Show</button>
        </div>

        <button type="submit" id="updateButton" class="primary">
            Update Password
        </button>

    </form>

</section>

<a href="advertiser-login.html" class="back">
    Back to Advertiser Login
</a>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
(function(){
"use strict";

const db=window.supabaseClient;

const message=document.getElementById("message");
const section=document.getElementById("passwordSection");
const form=document.getElementById("passwordForm");
const button=document.getElementById("updateButton");

function show(text,type){
    message.textContent=text;
    message.className="message "+type;
}

function showSection(){
    section.classList.remove("hidden");
}

function setLoading(loading){
    button.disabled=loading;
    button.textContent=loading
        ? "Updating..."
        : "Update Password";
}

document.querySelectorAll(".toggle").forEach(function(toggle){
    toggle.addEventListener("click",function(){
        const input=document.getElementById(
            toggle.dataset.target
        );

        if(!input)return;

        const showing=input.type==="password";

        input.type=showing?"text":"password";
        toggle.textContent=showing?"Hide":"Show";
    });
});

async function initializePage(){

    if(!db||!db.auth){
        show(
            "FrostTech could not connect to the account service. Please refresh and try again.",
            "error"
        );
        return;
    }

    const params=new URLSearchParams(
        window.location.search
    );

    const hashParams=new URLSearchParams(
        window.location.hash.replace(/^#/,"")
    );

    const hasResetRequest=params.get("reset")==="1";

    const hasRecoveryToken=
        hashParams.get("type")==="recovery" &&
        !!hashParams.get("access_token");

    const recoveryError=
        hashParams.get("error") ||
        params.get("error");

    if(recoveryError){
        show(
            "Your advertiser password-reset link is invalid, expired, or already used. Please request a new reset email.",
            "error"
        );
        return;
    }

    if(!hasResetRequest||!hasRecoveryToken){
        show(
            "A valid advertiser password-reset link is required. Please request a new reset email.",
            "error"
        );
        return;
    }

    const {data,error}=await db.auth.getSession();

    if(error||!data.session){
        show(
            "Your password-reset session is invalid or expired. Please request a new reset email.",
            "error"
        );
        return;
    }

    showSection();
}

form.addEventListener("submit",async function(event){

    event.preventDefault();

    if(!db||!db.auth){
        show(
            "FrostTech could not connect to the password-update service.",
            "error"
        );
        return;
    }

    const password=
        document.getElementById("newPassword").value;

    const confirmation=
        document.getElementById("confirmPassword").value;

    if(password.length<8){
        show(
            "Your new password must contain at least 8 characters.",
            "error"
        );
        return;
    }

    if(password!==confirmation){
        show(
            "The two passwords do not match. Please check them.",
            "error"
        );
        return;
    }

    setLoading(true);

    try{

        const {error}=await db.auth.updateUser({
            password:password
        });

        if(error)throw error;

        form.reset();

        show(
            "Your advertiser password has been updated successfully. You can now return to Advertiser Login.",
            "success"
        );

        section.classList.add("hidden");

    }catch(error){

        show(
            error.message ||
            "Your password could not be updated. Open the reset link from your email and try again.",
            "error"
        );

    }finally{
        setLoading(false);
    }

});

initializePage().catch(function(error){

    console.error("Advertiser password reset:",error);

    show(
        "The advertiser password-reset page could not start. Please refresh and try again.",
        "error"
    );

});

})();
</script>

</body>
</html>
