<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrostTech Step 3C - Admin Quote Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f7f9;
        }

        h1 {
            color: #123;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #loadBtn {
            background: #0066cc;
            color: white;
        }

        #saveBtn {
            background: #16803c;
            color: white;
        }

        select {
            padding: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 8px;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .label {
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>FrostTech Step 3C</h1>

<p>Admin Quote Management Test</p>

<button id="loadBtn" type="button">
    Load Customer Quote
</button>

<div id="status"></div>

<div id="quoteBox" class="card" style="display:none;">

    <h2 id="quoteTitle"></h2>

    <p>
        <span class="label">Request Number:</span>
        <span id="requestNumber"></span>
    </p>

    <p>
        <span class="label">Customer:</span>
        <span id="customerName"></span>
    </p>

    <p>
        <span class="label">Phone:</span>
        <span id="customerPhone"></span>
    </p>

    <p>
        <span class="label">Product:</span>
        <span id="productName"></span>
    </p>

    <p>
        <span class="label">Quantity:</span>
        <span id="quantity"></span>
    </p>

    <p>
        <span class="label">Preferred Brand:</span>
        <span id="preferredBrand"></span>
    </p>

    <p>
        <span class="label">Delivery Address:</span>
        <span id="deliveryAddress"></span>
    </p>

    <hr>

    <p class="label">Request Status</p>

    <select id="quoteStatus">
        <option value="pending">Pending</option>
        <option value="reviewing">Reviewing</option>
        <option value="quoted">Quoted</option>
        <option value="approved">Approved</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
    </select>

    <br>

    <button id="saveBtn" type="button">
        Save Status
    </button>

    <div id="saveMessage"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://nftxptjpgidcsgtaltjn.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const REQUEST_ID =
    "694e5ec3-5ceb-4238-b20d-326f1c07760e";


document
.getElementById("loadBtn")
.addEventListener("click", loadQuote);


document
.getElementById("saveBtn")
.addEventListener("click", saveStatus);


async function loadQuote() {

    const statusBox =
        document.getElementById("status");

    statusBox.innerHTML =
        "Loading customer quote...";


    try {

        const { data, error } =
            await supabaseClient
            .from("customer_requests")
            .select("*")
            .eq("id", REQUEST_ID)
            .single();


        if (error) {
            throw error;
        }


        if (!data) {
            throw new Error(
                "Customer quote request not found."
            );
        }


        document.getElementById("quoteTitle")
            .textContent =
            data.title || "Customer Quote Request";


        document.getElementById("requestNumber")
            .textContent =
            data.request_number || "";


        document.getElementById("productName")
            .textContent =
            data.title || "";


        document.getElementById("quantity")
            .textContent =
            data.quantity || "";


        document.getElementById("preferredBrand")
            .textContent =
            data.preferred_brand || "Not specified";


        document.getElementById("deliveryAddress")
            .textContent =
            data.delivery_address || "";


        document.getElementById("quoteStatus")
            .value =
            data.status || "pending";


        /*
         * Customer name and phone are stored
         * inside the description in this test record.
         */

        const description =
            data.description || "";


        const customerMatch =
            description.match(
                /Customer:\s*([^P]+?)\s*Phone:/i
            );


        const phoneMatch =
            description.match(
                /Phone:\s*([^P]+?)\s*Product:/i
            );


        document.getElementById("customerName")
            .textContent =
            customerMatch
            ? customerMatch[1].trim()
            : "Not available";


        document.getElementById("customerPhone")
            .textContent =
            phoneMatch
            ? phoneMatch[1].trim()
            : "Not available";


        document.getElementById("quoteBox")
            .style.display = "block";


        statusBox.innerHTML =
            '<p class="success">' +
            'Step 3C SUCCESS! Customer quote loaded.' +
            '</p>';

    }

    catch (error) {

        statusBox.innerHTML =
            '<p class="error">' +
            'Step 3C ERROR: ' +
            error.message +
            '</p>';

    }

}


async function saveStatus() {

    const newStatus =
        document.getElementById("quoteStatus").value;


    const saveMessage =
        document.getElementById("saveMessage");


    saveMessage.innerHTML =
        "Saving status...";


    try {

        const { error } =
            await supabaseClient
            .from("customer_requests")
            .update({
                status: newStatus
            })
            .eq("id", REQUEST_ID);


        if (error) {
            throw error;
        }


        saveMessage.innerHTML =
            '<p class="success">' +
            'Status saved successfully: ' +
            newStatus +
            '</p>';

    }

    catch (error) {

        saveMessage.innerHTML =
            '<p class="error">' +
            'SAVE ERROR: ' +
            error.message +
            '</p>';

    }

}

</script>

</body>
  </html>
