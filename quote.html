  </style></head><body>  <header>
    <h2>FrostTech HVAC and Refrigeration</h2><nav>
  <a href="index.html">Home</a> |
  <a href="catalog.html">Products</a> |

  </header>  <main class="quote-container"><h1>Request a Quote</h1>

<p>
  Tell us which HVAC or refrigeration product you need.
  Our team will review your request and prepare a quotation.
</p>

<div class="login-notice">
  Please sign in to your customer account before submitting
  a quote request.
  <br>
  <a href="customer-login.html">Customer Login</a>
</div>

<form id="quoteForm" class="quote-form">

  <label for="customerName">Full Name *</label>
  <input
    id="customerName"
    name="customerName"
    type="text"
    maxlength="150"
    autocomplete="name"
    required
  >

  <label for="customerPhone">Phone / WhatsApp *</label>
  <input
    id="customerPhone"
    name="customerPhone"
    type="tel"
    maxlength="30"
    autocomplete="tel"
    required
  >

  <label for="customerEmail">Email Address</label>
  <input
    id="customerEmail"
    name="customerEmail"
    type="email"
    maxlength="254"
    autocomplete="email"
  >

  <label for="productId">Product *</label>
  <select id="productId" name="productId" required>
    <option value="">Loading products...</option>
  </select>

  <label for="quantity">Quantity *</label>
  <input
    id="quantity"
    name="quantity"
    type="number"
    min="1"
    max="10000"
    step="1"
    value="1"
    required
  >

  <label for="preferredBrand">Preferred Brand</label>
  <input
    id="preferredBrand"
    name="preferredBrand"
    type="text"
    maxlength="100"
    placeholder="e.g. LG, Samsung, Daikin"
  >

  <label for="deliveryAddress">Delivery Address *</label>
  <textarea
    id="deliveryAddress"
    name="deliveryAddress"
    maxlength="1000"
    rows="3"
    autocomplete="street-address"
    required
  ></textarea>

  <label for="additionalDetails">Additional Requirements</label>
  <textarea
    id="additionalDetails"
    name="additionalDetails"
    maxlength="2000"
    rows="4"
    placeholder="Specifications, installation needs or other requirements"
  ></textarea>

  <button id="submitButton" type="submit">
    Submit Quote Request
  </button>

  <div
    id="formMessage"
    role="status"
    aria-live="polite"
  ></div>

</form>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="supabase.js"></script>  <script>
    "use strict";

    const form = document.getElementById("quoteForm");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");
    const productSelect = document.getElementById("productId");

    let client = null;
    let products = [];
    let submissionInProgress = false;

    function showMessage(message, type) {
      formMessage.textContent = message;
      formMessage.className = type;
      formMessage.style.display = "block";
    }

    function clearMessage() {
      formMessage.textContent = "";
      formMessage.className = "";
      formMessage.style.display = "none";
    }

    /*
      Reuse the existing FrostTech Supabase configuration.
    */
    function getClient() {
      if (window.supabaseClient) {
        return window.supabaseClient;
      }

      const url = window.SUPABASE_URL;

      const key =
        window.SUPABASE_PUBLISHABLE_KEY ||
        window.SUPABASE_ANON_KEY;

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function" &&
        url &&
        key
      ) {
        window.supabaseClient =
          window.supabase.createClient(url, key);

        return window.supabaseClient;
      }

      throw new Error(
        "Supabase is not configured correctly. Please check supabase.js."
      );
    }

    /*
      Load active products.
    */
    async function loadProducts() {
      productSelect.replaceChildren();

      const loadingOption = document.createElement("option");
      loadingOption.value = "";
      loadingOption.textContent = "Loading products...";
      productSelect.appendChild(loadingOption);

      try {
        client = getClient();

        const { data, error } = await client
          .from("products")
          .select("id, name, brand, model")
          .eq("is_active", true)
          .order("name");

        if (error) {
          throw error;
        }

        products = data || [];

        productSelect.replaceChildren();

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select a product";
        productSelect.appendChild(placeholder);

        products.forEach(function(product) {
          const option = document.createElement("option");

          option.value = product.id;

          option.textContent = [
            product.name,
            product.brand,
            product.model
          ].filter(Boolean).join(" - ");

          productSelect.appendChild(option);
        });

        if (products.length === 0) {
          showMessage(
            "No active products are currently available.",
            "error"
          );
        }

      } catch (error) {
        console.error("Product loading error:", error);

        products = [];

        productSelect.replaceChildren();

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Unable to load products";

        productSelect.appendChild(option);

        showMessage(
          "Unable to load products. Please refresh the page and try again.",
          "error"
        );
      }
    }

    /*
      Retrieve the authenticated user and validate their profile.
    */
    async function getActiveCustomer() {
      const {
        data: { user },
        error: authError
      } = await client.auth.getUser();

      if (authError) {
        console.error("Authentication error:", authError);

        throw new Error(
          "We could not verify your login. Please sign in again."
        );
      }

      if (!user) {
        throw new Error(
          "Please sign in to your FrostTech customer account before submitting your request."
        );
      }

      const { data: profile, error: profileError } = await client
        .from("profiles")
        .select("id, role, is_active")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) {
        console.error("Profile verification error:", profileError);

        throw new Error(
          "We could not verify your customer profile. Please try again."
        );
      }

      if (
        !profile ||
        profile.role !== "customer" ||
        profile.is_active !== true
      ) {
        throw new Error(
          "Your account does not have an active customer profile. Please contact FrostTech support."
        );
      }

      return user;
    }

    /*
      Submit the quote request.
    */
    async function handleQuoteSubmit(event) {
      event.preventDefault();
      event.stopPropagation();

      if (submissionInProgress) {
        return false;
      }

      submissionInProgress = true;
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      clearMessage();

      try {
        if (!client) {
          client = getClient();
        }

        // Verify the customer before accepting the request.
        const user = await getActiveCustomer();

        const customerName =
          document.getElementById("customerName").value.trim();

        const customerPhone =
          document.getElementById("customerPhone").value.trim();

        const customerEmail =
          document.getElementById("customerEmail").value.trim();

        const productId = productSelect.value;

        const quantity = Number(
          document.getElementById("quantity").value
        );

        const preferredBrand =
          document.getElementById("preferredBrand").value.trim();

        const deliveryAddress =
          document.getElementById("deliveryAddress").value.trim();

        const additionalDetails =
          document.getElementById("additionalDetails").value.trim();

        const selectedProduct = products.find(function(product) {
          return product.id === productId;
        });

        if (!customerName || !customerPhone || !deliveryAddress) {
          throw new Error(
            "Please complete your name, phone number and delivery address."
          );
        }

        if (!selectedProduct) {
          throw new Error(
            "Please select a valid product."
          );
        }

        if (!Number.isInteger(quantity) || quantity < 1 || quantity > 10000) {
          throw new Error(
            "Please enter a quantity between 1 and 10,000."
          );
        }

        const requestNumber =
          "FT-" +
          Date.now() +
          "-" +
          Math.random().toString(36).slice(2, 7).toUpperCase();

        const description =
          "Customer: " + customerName +
          "\nPhone: " + customerPhone +
          "\nEmail: " + (customerEmail || user.email || "Not provided") +
          "\nProduct: " + selectedProduct.name +
          "\nRequirements: " + (additionalDetails || "None");

        /*
          customer_id references profiles.id.

          The authenticated-customer INSERT policy requires
          customer_id to equal auth.uid().

          Other required fields use their existing database defaults.
        */
        const requestData = {
          customer_id: user.id,
          customer_name: customerName,
          customer_phone: customerPhone,
          customer_email: customerEmail || user.email || null,

          product_id: selectedProduct.id,
          request_number: requestNumber,
          title: "Quote Request - " + selectedProduct.name,
          description: description,
          quantity: quantity,

          preferred_brand:
            preferredBrand || selectedProduct.brand || null,

          delivery_address: deliveryAddress,
          status: "pending"
        };

        const { data, error } = await client
          .from("quote_requests")
          .insert(requestData)
          .select("id, request_number, status")
          .single();

        if (error) {
          console.error("Quote submission error:", error);

          throw new Error(
            "Your quote request could not be saved. " + error.message
          );
        }

        showMessage(
          "Your quote request was submitted successfully. Reference: " +
          data.request_number +
          ". FrostTech will review your request.",
          "success"
        );

        form.reset();

        document.getElementById("quantity").value = "1";

      } catch (error) {
        console.error("FrostTech quote submission failed:", error);

        showMessage(
          error.message ||
          "An unexpected error occurred. Please try again.",
          "error"
        );

      } finally {
        submissionInProgress = false;
        submitButton.disabled = false;
        submitButton.textContent = "Submit Quote Request";
      }

      return false;
    }

    form.addEventListener("submit", handleQuoteSubmit);

    loadProducts();
  </script></body>
