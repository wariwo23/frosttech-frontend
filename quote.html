<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Request a Quote | FrostTech HVAC and Refrigeration</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .quote-container {
      max-width: 650px;
      margin: 30px auto;
      padding: 24px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .quote-container h1,
    .quote-container > p {
      text-align: center;
    }

    .quote-form label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    .quote-form input,
    .quote-form select,
    .quote-form textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .quote-form button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 5px;
      background: #075985;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .quote-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #formMessage {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 5px;
      overflow-wrap: anywhere;
    }

    #formMessage.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #formMessage.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <header>
    <h2>FrostTech HVAC and Refrigeration</h2>

    <nav>
      <a href="index.html">Home</a> |
      <a href="product.html">Products</a> |
      <a href="quote.html">Request a Quote</a>
    </nav>
  </header>

  <main class="quote-container">

    <h1>Request a Quote</h1>

    <p>
      Tell us what HVAC or refrigeration product you need.
      Our team will review your request.
    </p>

    <!--
      IMPORTANT:
      The inline handler prevents normal browser form submission.
      This helps prevent an unwanted page refresh.
    -->
    <form
      id="quoteForm"
      class="quote-form"
      onsubmit="handleQuoteSubmit(event); return false;"
    >

      <label for="customerName">Full Name *</label>

      <input
        id="customerName"
        type="text"
        maxlength="150"
        autocomplete="name"
        required
      >

      <label for="customerPhone">Phone / WhatsApp *</label>

      <input
        id="customerPhone"
        type="tel"
        maxlength="30"
        autocomplete="tel"
        required
      >

      <label for="customerEmail">Email Address</label>

      <input
        id="customerEmail"
        type="email"
        maxlength="254"
        autocomplete="email"
      >

      <label for="productId">Product *</label>

      <select id="productId" required>
        <option value="">Loading products...</option>
      </select>

      <label for="quantity">Quantity *</label>

      <input
        id="quantity"
        type="number"
        min="1"
        max="10000"
        step="1"
        value="1"
        required
      >

      <label for="preferredBrand">Preferred Brand</label>

      <input
        id="preferredBrand"
        type="text"
        maxlength="100"
        placeholder="e.g. LG, Samsung, Daikin"
      >

      <label for="deliveryAddress">Delivery Address *</label>

      <textarea
        id="deliveryAddress"
        maxlength="1000"
        rows="3"
        required
      ></textarea>

      <label for="additionalDetails">Requirements</label>

      <textarea
        id="additionalDetails"
        maxlength="2000"
        rows="4"
        placeholder="Add specifications or other requirements"
      ></textarea>

      <button id="submitButton" type="submit">
        Submit Quote Request
      </button>

      <div
        id="formMessage"
        role="status"
        aria-live="polite"
      ></div>

    </form>

  </main>

  <!-- Load Supabase before the FrostTech configuration. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    "use strict";

    const form = document.getElementById("quoteForm");
    const submitButton = document.getElementById("submitButton");
    const formMessage = document.getElementById("formMessage");
    const productSelect = document.getElementById("productId");

    let client = null;
    let products = [];
    let submissionInProgress = false;

    /*
      Display messages.

      Do not set display:none directly on the message element:
      an inline display:none would hide even an error message.
    */
    function showMessage(message, type) {
      formMessage.textContent = message;
      formMessage.className = type;
      formMessage.style.display = "block";
    }

    function clearMessage() {
      formMessage.textContent = "";
      formMessage.className = "";
      formMessage.style.display = "none";
    }

    /*
      Reuse the Supabase client configured in supabase.js.
    */
    function getClient() {
      if (window.supabaseClient) {
        return window.supabaseClient;
      }

      const url = window.SUPABASE_URL;

      const key =
        window.SUPABASE_PUBLISHABLE_KEY ||
        window.SUPABASE_ANON_KEY;

      if (
        window.supabase &&
        typeof window.supabase.createClient === "function" &&
        url &&
        key
      ) {
        window.supabaseClient = window.supabase.createClient(
          url,
          key
        );

        return window.supabaseClient;
      }

      throw new Error(
        "Supabase client not found. Check the configuration in supabase.js."
      );
    }

    /*
      Load active products into the product dropdown.
    */
    async function loadProducts() {
      productSelect.replaceChildren();

      const loadingOption = document.createElement("option");
      loadingOption.value = "";
      loadingOption.textContent = "Loading products...";
      productSelect.appendChild(loadingOption);

      try {
        client = getClient();

        const { data, error } = await client
          .from("products")
          .select("id, name, brand, model")
          .eq("is_active", true)
          .order("name");

        if (error) {
          throw error;
        }

        products = data || [];

        productSelect.replaceChildren();

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select a product";
        productSelect.appendChild(placeholder);

        products.forEach(function(product) {
          const option = document.createElement("option");

          option.value = product.id;

          option.textContent = [
            product.name,
            product.brand,
            product.model
          ].filter(Boolean).join(" - ");

          productSelect.appendChild(option);
        });

        if (products.length === 0) {
          showMessage(
            "No active products are available. Please contact FrostTech.",
            "error"
          );
        } else {
          clearMessage();
        }

      } catch (error) {
        console.error("FrostTech product loading error:", error);

        products = [];

        productSelect.replaceChildren();

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Unable to load products";

        productSelect.appendChild(option);

        showMessage(
          "Unable to load products. Please refresh the page or contact FrostTech.",
          "error"
        );
      }
    }

    /*
      Handle customer quote submissions.

      This function is called directly by the form's onsubmit
      attribute, so we do not depend on addEventListener().
    */
    async function handleQuoteSubmit(event) {

      // Stop the browser's default form submission immediately.
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      // Prevent accidental double submissions.
      if (submissionInProgress) {
        return false;
      }

      submissionInProgress = true;

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      clearMessage();

      try {
        if (!client) {
          client = getClient();
        }

        const customerName =
          document.getElementById("customerName").value.trim();

        const customerPhone =
          document.getElementById("customerPhone").value.trim();

        const customerEmail =
          document.getElementById("customerEmail").value.trim();

        const productId = productSelect.value;

        const quantity = Number(
          document.getElementById("quantity").value
        );

        const preferredBrand =
          document.getElementById("preferredBrand").value.trim();

        const deliveryAddress =
          document.getElementById("deliveryAddress").value.trim();

        const additionalDetails =
          document.getElementById("additionalDetails").value.trim();

        const selectedProduct = products.find(function(product) {
          return product.id === productId;
        });

        /*
          Validate the form before contacting Supabase.
        */
        if (!customerName || !customerPhone || !deliveryAddress) {
          throw new Error(
            "Please complete your name, phone number and delivery address."
          );
        }

        if (!selectedProduct) {
          throw new Error("Please select a valid product.");
        }

        if (!Number.isInteger(quantity) || quantity < 1) {
          throw new Error("Please enter a valid quantity.");
        }

        /*
          Build the request using the existing quote_requests
          column structure used by the current FrostTech page.
        */
        const requestNumber =
          "FT-" +
          Date.now() +
          "-" +
          Math.random().toString(36).slice(2, 7).toUpperCase();

        const description =
          "Customer: " + customerName +
          "\nPhone: " + customerPhone +
          "\nEmail: " + (customerEmail || "Not provided") +
          "\nProduct: " + selectedProduct.name +
          "\nRequirements: " + (additionalDetails || "None");

        const requestData = {
          product_id: selectedProduct.id,
          request_number: requestNumber,
          title: "Quote Request - " + selectedProduct.name,
          description: description,
          quantity: quantity,
          preferred_brand:
            preferredBrand || selectedProduct.brand || null,
          delivery_address: deliveryAddress,
          status: "pending"
        };

        /*
          Insert into Supabase and request the saved record back.
        */
        const { data, error } = await client
          .from("quote_requests")
          .insert(requestData)
          .select("id, request_number, status")
          .single();

        if (error) {
          console.error(
            "FrostTech Supabase submission error:",
            error
          );

          throw new Error(
            "Your request could not be saved. " + error.message
          );
        }

        /*
          Only show success after Supabase confirms the insert.
        */
        showMessage(
          "Your quote request was submitted successfully. " +
          "Reference: " + data.request_number +
          ". FrostTech will review your request.",
          "success"
        );

        form.reset();

        document.getElementById("quantity").value = "1";

      } catch (error) {
        console.error("FrostTech quote submission failed:", error);

        showMessage(
          error.message ||
          "An unexpected error occurred. Please try again.",
          "error"
        );

      } finally {
        submissionInProgress = false;

        submitButton.disabled = false;
        submitButton.textContent = "Submit Quote Request";
      }

      return false;
    }

    /*
      Load products when the page starts.
    */
    loadProducts();
  </script>

</body>
</html>
