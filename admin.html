<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FrostTech Admin</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="container">
      <h1>FrostTech HVAC and Refrigeration</h1>
      <p>Admin Dashboard</p>
    </div>
  </header>

  <main class="container">

    <h2>Customer Quote Requests</h2>

    <div id="message">
      Loading quote requests...
    </div>

    <div id="quotes-container"></div>

  </main>

  <script>

    async function loadQuoteRequests() {

      const container = document.getElementById("quotes-container");
      const message = document.getElementById("message");

      const { data, error } = await supabaseClient
        .from("quote_requests")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);

        message.textContent =
          "Error loading quote requests: " + error.message;

        return;
      }

      if (!data || data.length === 0) {
        message.textContent = "No quote requests found.";
        return;
      }

      message.textContent =
        data.length + " quote request(s) found.";

      container.innerHTML = "";

      data.forEach(function(request) {

        const card = document.createElement("div");

        card.style.border = "1px solid #ddd";
        card.style.padding = "20px";
        card.style.marginBottom = "20px";
        card.style.borderRadius = "10px";
        card.style.background = "#fff";

        card.innerHTML = `
          <h3>${request.title || "Quote Request"}</h3>

          <p>
  <strong>Current Status:</strong>

  <select
    onchange="updateQuoteStatus('${request.id}', this.value)"
    style="padding:8px; margin-left:8px;"
  >
    <option value="pending" ${request.status === "pending" ? "selected" : ""}>
      Pending
    </option>

    <option value="reviewing" ${request.status === "reviewing" ? "selected" : ""}>
      Reviewing
    </option>

    <option value="quoted" ${request.status === "quoted" ? "selected" : ""}>
      Quoted
    </option>

    <option value="approved" ${request.status === "approved" ? "selected" : ""}>
      Approved
    </option>

    <option value="rejected" ${request.status === "rejected" ? "selected" : ""}>
      Rejected
    </option>
  </select>
</p>
        `;

        container.appendChild(card);

      });

    }
async function updateQuoteStatus(requestId, newStatus) {

  const { error } = await supabaseClient
    .from("quote_requests")
    .update({
      status: newStatus,
      updated_at: new Date().toISOString()
    })
    .eq("id", requestId);

  if (error) {
    alert("Could not update status: " + error.message);
    return;
  }

  alert("Quote status updated to: " + newStatus);
}
    loadQuoteRequests();

  </script>

</body>
      </html>
