<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FrostTech Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f7f9;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0052a3;
    }

    .hidden {
      display: none;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .quote {
      border-top: 1px solid #ddd;
      padding-top: 20px;
      margin-top: 20px;
    }

    .quote-details {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .supplier-quotes {
      background: #eef6ff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .saved-quote {
      background: white;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .total-box {
      background: #e9f7ef;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>FrostTech HVAC and Refrigeration</h1>

  <h2>Admin Dashboard</h2>


  <!-- LOGIN -->

  <div id="login-section" class="card">

    <h3>Admin Login</h3>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="login-message"></p>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard-section" class="hidden">

    <div class="card">

      <p>
        <strong>Logged in as:</strong>
        <span id="admin-name"></span>
        |
        <strong>Role:</strong>
        <span id="admin-role"></span>
      </p>

      <button onclick="logout()">
        Logout
      </button>

    </div>


    <!-- CUSTOMER QUOTE REQUESTS -->

    <div class="card">

      <h2>Customer Quote Requests</h2>

      <div id="quote-requests">
        Loading quote requests...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://nftxptjpgidcsgtaltjn.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mdHhwdGpwZ2lkY3NndGFsdGpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NjI2NTUsImV4cCI6MjEwNjMzODY1NX0.TJc8bkEqdyc_yuv8oTiKQApd3L5j2ppASi-9zr-WtP0";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   LOGIN
===================================================== */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("login-message");


  if (!email || !password) {

    message.className = "error";

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  message.className = "";

  message.textContent =
    "Logging in...";


  try {

    const {
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.className = "error";

      message.textContent =
        error.message;

      return;
    }


    await checkAdminAccess();

  }

  catch (error) {

    console.error(error);

    message.className = "error";

    message.textContent =
      "Login error: " +
      error.message;

  }

}


/* =====================================================
   CHECK ADMIN ACCESS
===================================================== */

async function checkAdminAccess() {

  try {

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !user) {

      document
        .getElementById("login-section")
        .classList.remove("hidden");

      document
        .getElementById("dashboard-section")
        .classList.add("hidden");

      return;
    }


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select(
          "full_name, role, is_active"
        )
        .eq("id", user.id)
        .single();


    if (profileError) {

      document
        .getElementById("login-message")
        .className = "error";

      document
        .getElementById("login-message")
        .textContent =
          "Profile check failed: " +
          profileError.message;

      return;
    }


    if (
      profile.role !== "admin" ||
      profile.is_active !== true
    ) {

      document
        .getElementById("login-message")
        .className = "error";

      document
        .getElementById("login-message")
        .textContent =
          "Access denied.";

      await supabaseClient.auth.signOut();

      return;
    }


    document
      .getElementById("admin-name")
      .textContent =
        profile.full_name || "Admin";


    document
      .getElementById("admin-role")
      .textContent =
        profile.role;


    document
      .getElementById("login-section")
      .classList.add("hidden");


    document
      .getElementById("dashboard-section")
      .classList.remove("hidden");


    await loadQuoteRequests();

  }

  catch (error) {

    console.error(error);

    document
      .getElementById("login-message")
      .className = "error";

    document
      .getElementById("login-message")
      .textContent =
        "Dashboard error: " +
        error.message;

  }

}


/* =====================================================
   LOAD CUSTOMER QUOTE REQUESTS
===================================================== */

async function loadQuoteRequests() {

  const container =
    document.getElementById(
      "quote-requests"
    );


  container.innerHTML =
    "Loading quote requests...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("quote_requests")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML =
      '<p class="error">' +
      "Error loading quote requests: " +
      escapeHtml(error.message) +
      "</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No quote requests found.</p>";

    return;
  }


  container.innerHTML =
    "<p><strong>" +
    data.length +
    " quote request(s) found.</strong></p>";


  data.forEach(
    request => {

      const div =
        document.createElement("div");


      div.className =
        "quote card";


      div.innerHTML = `

        <h3>
          ${escapeHtml(
            request.title ||
            "Quote Request"
          )}
        </h3>


        <div class="quote-details">

          <p>
            <strong>Request Number:</strong>
            ${escapeHtml(
              request.request_number || ""
            )}
          </p>


          <p>
            <strong>Description:</strong>
            ${escapeHtml(
              request.description || ""
            )}
          </p>


          <p>
            <strong>Category:</strong>
            ${escapeHtml(
              request.category || ""
            )}
          </p>


          <p>
            <strong>Quantity:</strong>
            ${request.quantity ?? ""}
          </p>


          <p>
            <strong>Preferred Brand:</strong>
            ${escapeHtml(
              request.preferred_brand || ""
            )}
          </p>


          <p>
            <strong>Budget:</strong>

            ${
              request.budget !== null &&
              request.budget !== undefined &&
              request.budget !== ""

              ? escapeHtml(
                  request.budget
                )

              : "Not specified"
            }

          </p>


          <p>
            <strong>Delivery Address:</strong>

            ${escapeHtml(
              request.delivery_address || ""
            )}

          </p>


          <label>Status</label>

          <select
            id="status-${request.id}"
          >

            <option value="pending">
              Pending
            </option>

            <option value="reviewing">
              Reviewing
            </option>

            <option value="quoted">
              Quoted
            </option>

            <option value="approved">
              Approved
            </option>

            <option value="rejected">
              Rejected
            </option>

          </select>


          <button
            onclick="updateQuoteStatus('${request.id}')">

            Save Status

          </button>

        </div>


        <!-- SUPPLIER QUOTATION -->

        <div class="supplier-quotes">

          <h3>
            Supplier Quotation
          </h3>


          <p>
            Enter the supplier quotation
            details for this customer request.
          </p>


          <label>
            Supplier ID
          </label>

          <input
            id="supplier-${request.id}"
            placeholder="Supplier UUID"
          >


          <label>
            Product ID
            <small>
              (Optional)
            </small>
          </label>

          <input
            id="product-${request.id}"
            placeholder="Product UUID - optional"
          >


          <label>
            Quantity
          </label>

          <input
            id="quantity-${request.id}"
            type="number"
            min="1"
            value="${request.quantity || 1}"
            oninput="calculateTotal('${request.id}')"
          >


          <label>
            Supplier Unit Price (₦)
          </label>

          <input
            id="unit-price-${request.id}"
            type="number"
            min="0"
            placeholder="Enter supplier unit price"
            oninput="calculateTotal('${request.id}')"
          >


          <label>
            Delivery Cost (₦)
          </label>

          <input
            id="delivery-${request.id}"
            type="number"
            min="0"
            value="0"
            oninput="calculateTotal('${request.id}')"
          >


          <div
            id="total-${request.id}"
            class="total-box">

            Supplier Total: ₦0

          </div>


          <label>
            Valid Until
            <small>
              (Optional)
            </small>
          </label>

          <input
            id="valid-until-${request.id}"
            type="datetime-local"
          >


          <label>
            Status
          </label>

          <select
            id="supplier-status-${request.id}"
          >

            <option value="submitted">
              Submitted
            </option>

            <option value="accepted">
              Accepted
            </option>

            <option value="rejected">
              Rejected
            </option>

            <option value="expired">
              Expired
            </option>

          </select>


          <label>
            Supplier Notes
          </label>

          <textarea
            id="notes-${request.id}"
            placeholder="Enter supplier notes"
          ></textarea>


          <button
            onclick="saveSupplierQuotation('${request.id}')">

            Save Supplier Quotation

          </button>


          <div
            id="saved-quotes-${request.id}">

            Loading supplier quotations...

          </div>

        </div>

      `;


      container.appendChild(div);


      document.getElementById(
        `status-${request.id}`
      ).value =
        request.status || "pending";


      loadSupplierQuotations(
        request.id
      );

    }
  );

}


/* =====================================================
   CALCULATE SUPPLIER TOTAL
===================================================== */

function calculateTotal(
  requestId
) {

  const quantity =
    Number(
      document.getElementById(
        `quantity-${requestId}`
      ).value || 0
    );


  const unitPrice =
    Number(
      document.getElementById(
        `unit-price-${requestId}`
      ).value || 0
    );


  const deliveryCost =
    Number(
      document.getElementById(
        `delivery-${requestId}`
      ).value || 0
    );


  const total =
    (quantity * unitPrice) +
    deliveryCost;


  document.getElementById(
    `total-${requestId}`
  ).textContent =
    "Supplier Total: ₦" +
    total.toLocaleString();

}


/* =====================================================
   UPDATE CUSTOMER QUOTE STATUS
===================================================== */

async function updateQuoteStatus(
  requestId
) {

  const status =
    document.getElementById(
      `status-${requestId}`
    ).value;


  const {
    error
  } =
    await supabaseClient
      .from("quote_requests")
      .update({

        status: status,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        requestId
      );


  if (error) {

    alert(
      "Could not update status: " +
      error.message
    );

    return;
  }


  alert(
    "Quote request status updated."
  );

}


/* =====================================================
   SAVE SUPPLIER QUOTATION
===================================================== */

    );

      ).value
    );

      ).value || 0
    );

    document.getElementById(
      `notes-${requestId}`
    ).value.trim();


  const validUntilValue =

    ).value;

    ).value;

  const supplierTotal =
    (quantity * unitPrice) +

  const supplierQuote = {

  ).value = "";

/* =====================================================
   LOAD SAVED SUPPLIER QUOTATIONS
===================================================== */

async function loadSupplierQuotations(
  requestId
) {

  const container =
    document.getElementById(
      `saved-quotes-${requestId}`
    );


  if (!container) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("supplier_quotes")
      .select("*")
      .eq(
        "request_id",
        requestId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML =
      '<p class="error">' +
      "Could not load supplier quotations: " +
      escapeHtml(
        error.message
      ) +
      "</p>";

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML =
      "<p>No supplier quotations submitted yet.</p>";

    return;
  }


  container.innerHTML =
    "<h4>Saved Supplier Quotations</h4>";


  data.forEach(
    quote => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "saved-quote";


      div.innerHTML = `

        <p>
          <strong>Supplier ID:</strong>

          ${escapeHtml(
            quote.supplier_id || ""
          )}

        </p>


        <p>
          <strong>Product ID:</strong>

          ${escapeHtml(
            quote.product_id || "Not specified"
          )}

        </p>


        <p>
          <strong>Quantity:</strong>

          ${quote.quantity ?? ""}

        </p>


        <p>
          <strong>Supplier Unit Price:</strong>

          ₦${Number(
            quote.supplier_unit_price || 0
          ).toLocaleString()}

        </p>


        <p>
          <strong>Delivery Cost:</strong>

          ₦${Number(
            quote.delivery_cost || 0
          ).toLocaleString()}

        </p>


        <p>
          <strong>Supplier Total:</strong>

          ₦${Number(
            quote.supplier_total || 0
          ).toLocaleString()}

        </p>


        <p>
          <strong>Valid Until:</strong>

          ${
            quote.valid_until
              ? new Date(
                  quote.valid_until
                ).toLocaleString()
              : "Not specified"
          }

        </p>


        <p>
          <strong>Status:</strong>

          ${escapeHtml(
            quote.status || ""
          )}

        </p>


        <p>
          <strong>Notes:</strong>

          ${escapeHtml(
            quote.notes || "None"
          )}

        </p>

      `;


      container.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

checkAdminAccess();

</script>
