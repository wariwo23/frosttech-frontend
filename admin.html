<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrostTech Admin</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 18px;
      text-align: center;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #0b5ed7;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      background: #dc3545;
    }

    .success {
      color: #198754;
      font-weight: bold;
    }

    .error {
      color: #dc3545;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .request,
    .quotation {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      background: #e9ecef;
      font-size: 13px;
      font-weight: bold;
    }

    .amount {
      font-size: 18px;
      font-weight: bold;
    }

    .system-status {
      padding: 10px;
      border-radius: 6px;
      background: #eef3f8;
      margin-bottom: 15px;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 650px) {
      main {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>FrostTech Admin</h1>
  <p>HVAC and Refrigeration Marketplace</p>
</header>

<main>

  <div class="card">
    <h2>System Status</h2>
    <div id="systemStatus" class="system-status">
      Connecting to Supabase...
    </div>
  </div>

  <div id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Admin email"
      autocomplete="username"
    >

    <label>Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>
  <div id="dashboardSection" class="hidden">

    <div class="card">

      <h2>Admin Dashboard</h2>

      <p>
        Logged in as:
        <strong id="adminEmail"></strong>
      </p>

      <button id="logoutButton" type="button" class="logout">
        Logout
      </button>

    </div>


    <div class="card">

      <h2>Customer Quote Requests</h2>

      <button id="refreshRequestsButton" type="button">
        Refresh Requests
      </button>

      <div id="requestsMessage"></div>

      <div id="requestsContainer">
        Loading requests...
      </div>

    </div>


    <div class="card">

      <h2>Supplier Quotations</h2>

      <button id="refreshQuotesButton" type="button">
        Refresh Supplier Quotations
      </button>

      <div id="quotesMessage"></div>

      <div id="quotesContainer">
        Loading supplier quotations...
      </div>

    </div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://nftxptjpgidcsgtaltjn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const systemStatus =
    document.getElementById("systemStatus");

  const loginSection =
    document.getElementById("loginSection");

  const dashboardSection =
    document.getElementById("dashboardSection");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const adminEmail =
    document.getElementById("adminEmail");

  const logoutButton =
    document.getElementById("logoutButton");

  const requestsContainer =
    document.getElementById("requestsContainer");

  const requestsMessage =
    document.getElementById("requestsMessage");

  const quotesContainer =
    document.getElementById("quotesContainer");

  const quotesMessage =
    document.getElementById("quotesMessage");

  const refreshRequestsButton =
    document.getElementById("refreshRequestsButton");

  const refreshQuotesButton =
    document.getElementById("refreshQuotesButton");


  function setSystemStatus(message, type = "") {

    systemStatus.textContent = message;

    systemStatus.className = "system-status";

    if (type === "success") {
      systemStatus.classList.add("success");
    }

    if (type === "error") {
      systemStatus.classList.add("error");
    }

  }


  async function initializeAdmin() {

    try {

      setSystemStatus(
        "Supabase connection initialized successfully.",
        "success"
      );

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (session) {

        await handleAuthenticatedUser(
          session.user
        );

      } else {

        showLogin();

      }

    } catch (error) {

      console.error(error);

      setSystemStatus(
        "Supabase initialization failed: " +
        error.message,
        "error"
      );

    }

  }


  function showLogin() {

    loginSection.classList.remove("hidden");

    dashboardSection.classList.add("hidden");

    loginMessage.textContent = "";

  }


  function showDashboard(user) {

    loginSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");

    adminEmail.textContent =
      user.email || "Unknown";

  }


  async function loginAdmin() {

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;

    loginMessage.className = "";

    if (!email || !password) {

      loginMessage.textContent =
        "Please enter your email and password.";

      loginMessage.className = "error";

      return;

    }

    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    loginMessage.textContent = "";

    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {

        throw error;

      }

      if (!data || !data.user) {

        throw new Error(
          "Login succeeded but no user session was returned."
        );

      }

      await handleAuthenticatedUser(
        data.user
      );

    } catch (error) {

      console.error("Login error:", error);

      loginMessage.textContent =
        "Login failed: " + error.message;

      loginMessage.className = "error";

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }

  }
  async function handleAuthenticatedUser(user) {

    try {

      const {
        data: profile,
        error
      } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        throw error;
      }

      if (!profile) {

        await supabaseClient.auth.signOut();

        showLogin();

        loginMessage.textContent =
          "No FrostTech profile was found for this account.";

        loginMessage.className = "error";

        return;
      }

      if (profile.role !== "admin") {

        await supabaseClient.auth.signOut();

        showLogin();

        loginMessage.textContent =
          "Access denied. This account is not an admin.";

        loginMessage.className = "error";

        return;
      }

      if (profile.is_active === false) {

        await supabaseClient.auth.signOut();

        showLogin();

        loginMessage.textContent =
          "This admin account is inactive.";

        loginMessage.className = "error";

        return;
      }

      showDashboard(user);

      await loadRequests();

      await loadSupplierQuotes();

    } catch (error) {

      console.error(
        "Admin profile error:",
        error
      );

      await supabaseClient.auth.signOut();

      showLogin();

      loginMessage.textContent =
        "Admin verification failed: " +
        error.message;

      loginMessage.className = "error";
    }

  }


  async function logoutAdmin() {

    logoutButton.disabled = true;

    try {

      const {
        error
      } = await supabaseClient.auth.signOut();

      if (error) {
        throw error;
      }

      showLogin();

      loginEmail.value = "";

      loginPassword.value = "";

      requestsContainer.innerHTML = "";

      quotesContainer.innerHTML = "";

      setSystemStatus(
        "Logged out successfully."
      );

    } catch (error) {

      console.error(error);

      alert(
        "Logout failed: " +
        error.message
      );

    } finally {

      logoutButton.disabled = false;

    }

  }


  async function loadRequests() {

    requestsContainer.innerHTML =
      "Loading customer quote requests...";

    requestsMessage.textContent = "";

    try {

      let result =
        await supabaseClient
          .from("quote_requests")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (result.error) {

        console.warn(
          "quote_requests query failed:",
          result.error
        );

        result =
          await supabaseClient
            .from("customer_requests")
            .select("*")
            .order("created_at", {
              ascending: false
            });

      }


      if (result.error) {
        throw result.error;
      }


      const requests =
        result.data || [];


      if (requests.length === 0) {

        requestsContainer.innerHTML =
          "<p>No customer quote requests found.</p>";

        return;
      }


      requestsContainer.innerHTML = "";


      requests.forEach(function(request) {

        const card =
          document.createElement("div");

        card.className = "request";


        const requestNumber =
          request.request_number ||
          request.request_no ||
          request.reference ||
          request.id ||
          "N/A";


        const status =
          request.status ||
          "pending";


        const customer =
          request.customer_name ||
          request.name ||
          request.full_name ||
          request.customer ||
          "N/A";


        const phone =
          request.phone ||
          request.customer_phone ||
          request.phone_number ||
          "N/A";


        const product =
          request.product_name ||
          request.product ||
          request.description ||
          "N/A";


        const quantity =
          request.quantity ||
          1;


        const deliveryAddress =
          request.delivery_address ||
          request.address ||
          request.location ||
          "N/A";


        card.innerHTML = `

          <h3>
            Request ${escapeHtml(requestNumber)}
          </h3>

          <p>
            <strong>Status:</strong>
            <span class="status">
              ${escapeHtml(status)}
            </span>
          </p>

          <p>
            <strong>Customer:</strong>
            ${escapeHtml(customer)}
          </p>

          <p>
            <strong>Phone:</strong>
            ${escapeHtml(phone)}
          </p>

          <p>
            <strong>Product:</strong>
            ${escapeHtml(product)}
          </p>

          <p>
            <strong>Quantity:</strong>
            ${escapeHtml(String(quantity))}
          </p>

          <p>
            <strong>Delivery Address:</strong>
            ${escapeHtml(deliveryAddress)}
          </p>

          <p class="small">
            Request ID:
            ${escapeHtml(request.id || "N/A")}
          </p>

        `;


        requestsContainer.appendChild(card);

      });


    } catch (error) {

      console.error(
        "Load requests error:",
        error
      );

      requestsContainer.innerHTML =
        "<p class='error'>Unable to load customer requests.</p>";

      requestsMessage.textContent =
        error.message;

      requestsMessage.className = "error";

    }

  }


  async function loadSupplierQuotes() {

    quotesContainer.innerHTML =
      "Loading supplier quotations...";

    quotesMessage.textContent = "";

    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("supplier_quotes")
        .select("*")
        .order("created_at", {
          ascending: false
        });


      if (error) {
        throw error;
      }


      const quotes =
        data || [];


      if (quotes.length === 0) {

        quotesContainer.innerHTML =
          "<p>No supplier quotations found.</p>";

        return;
      }


      quotesContainer.innerHTML = "";


      quotes.forEach(function(quote) {

        const card =
          document.createElement("div");

        card.className = "quotation";


        const supplierPrice =
          Number(
            quote.supplier_total || 0
          );


        const deliveryCost =
          Number(
            quote.delivery_cost || 0
          );


        const marginAmount =
          Number(
            quote.frosttech_margin_amount || 0
          );


        const customerTotal =
          Number(
            quote.customer_total || 0
          );


        const marginPercent =
          Number(
            quote.frosttech_margin_percent || 0
          );


        const status =
          quote.status ||
          "submitted";


        const customerQuoteStatus =
          quote.customer_quote_status ||
          "draft";


        card.innerHTML = `

          <h3>
            Supplier Quotation
          </h3>

          <p>
            <strong>Status:</strong>
            <span class="status">
              ${escapeHtml(status)}
            </span>
          </p>

          <p>
            <strong>Request ID:</strong>
            ${escapeHtml(
              quote.request_id || "N/A"
            )}
          </p>

          <p>
            <strong>Supplier ID:</strong>
            ${escapeHtml(
              quote.supplier_id || "N/A"
            )}
          </p>

          <p>
            <strong>Product ID:</strong>
            ${escapeHtml(
              quote.product_id || "N/A"
            )}
          </p>

          <p>
            <strong>Quantity:</strong>
            ${escapeHtml(
              String(quote.quantity || 1)
            )}
          </p>

          <p>
            <strong>Supplier Total:</strong>
            ₦${formatMoney(supplierPrice)}
          </p>

          <p>
            <strong>Delivery Cost:</strong>
            ₦${formatMoney(deliveryCost)}
          </p>

          <p>
            <strong>FrostTech Margin:</strong>
            ${formatMoney(marginPercent)}%
          </p>

          <p>
            <strong>FrostTech Margin Amount:</strong>
            ₦${formatMoney(marginAmount)}
          </p>

          <p class="amount">
            Customer Total:
            ₦${formatMoney(customerTotal)}
          </p>

          <p>
            <strong>Customer Quote Status:</strong>
            ${escapeHtml(customerQuoteStatus)}
          </p>

          ${
            quote.notes
              ? `
                <p>
                  <strong>Supplier Notes:</strong>
                  ${escapeHtml(quote.notes)}
                </p>
              `
              : ""
          }

          ${
            quote.valid_until
              ? `
                <p>
                  <strong>Valid Until:</strong>
                  ${escapeHtml(
                    formatDate(quote.valid_until)
                  )}
                </p>
              `
              : ""
          }

          <p class="small">
            Quote ID:
            ${escapeHtml(
              quote.id || "N/A"
            )}
          </p>

        `;


        quotesContainer.appendChild(card);

      });


    } catch (error) {

      console.error(
        "Load supplier quotes error:",
        error
      );

      quotesContainer.innerHTML =
        "<p class='error'>Unable to load supplier quotations.</p>";

      quotesMessage.textContent =
        error.message;

      quotesMessage.className = "error";

    }

  }
  function formatMoney(value) {

    return Number(value || 0)
      .toLocaleString(
        "en-NG",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }
      );

  }


  function formatDate(value) {

    try {

      return new Date(value)
        .toLocaleString("en-NG");

    } catch {

      return value;

    }

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * BUTTON EVENT LISTENERS
   *
   * We deliberately use addEventListener()
   * instead of onclick="..."
   */

  loginButton.addEventListener(
    "click",
    function() {

      loginAdmin();

    }
  );


  logoutButton.addEventListener(
    "click",
    function() {

      logoutAdmin();

    }
  );


  refreshRequestsButton.addEventListener(
    "click",
    function() {

      loadRequests();

    }
  );


  refreshQuotesButton.addEventListener(
    "click",
    function() {

      loadSupplierQuotes();

    }
  );


  /*
   * Allow Enter key to submit login.
   */

  loginPassword.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        loginAdmin();

      }

    }
  );


  /*
   * AUTH STATE LISTENER
   */

  supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

      console.log(
        "Auth event:",
        event
      );

      if (session && session.user) {

        await handleAuthenticatedUser(
          session.user
        );

      } else {

        showLogin();

      }

    }
  );


  /*
   * START APPLICATION
   */

  initializeAdmin();

</script>

</body>
</html>
