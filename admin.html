<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrostTech Admin</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<header>
<h1>FrostTech Admin</h1>
<p>HVAC and Refrigeration Marketplace</p>
</header>

<main>

<section class="card">
<h2>System Status</h2>
<div id="systemStatus">Connecting...</div>
</section>

<section id="loginSection" class="card">
<h2>Admin Login</h2>

<input id="email" type="email"
placeholder="Admin email">

<input id="password" type="password"
placeholder="Password">

<button id="loginBtn" type="button">
Login
</button>

<div id="loginMessage"></div>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<h2>Admin Dashboard</h2>

<p>
Logged in as:
<strong id="adminEmail"></strong>
</p>

<button id="logoutBtn"
class="danger"
type="button">
Logout
</button>
</div>

<div class="card">
<h2>Customer Quote Requests</h2>

<button id="refreshRequestsBtn"
type="button">
Refresh Requests
</button>

<div id="requestMessage"></div>

<div id="requests">
Loading customer requests...
</div>
</div>

<div class="card">
<h2>Supplier Quotations</h2>

<button id="refreshQuotesBtn"
type="button">
Refresh Supplier Quotations
</button>

<div id="quoteMessage"></div>

<div id="quotes">
Loading supplier quotations...
</div>
</div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>
</html>
