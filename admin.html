/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return "";

  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* =========================================
   LOGIN
   ========================================= */

async function loginAdmin() {

  const email =
    document
      .getElementById("login-email")
      .value
      .trim();

  const password =
    document
      .getElementById("login-password")
      .value;

  const message =
    document.getElementById(
      "login-message"
    );

  message.textContent =
    "Logging in...";

  message.className = "";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    console.error(
      "Login error:",
      error
    );

    message.textContent =
      error.message;

    message.className =
      "error";

    return;

  }


  await checkAdminAccess();

}



/* =========================================
   CHECK ADMIN ACCESS
   ========================================= */

async function checkAdminAccess() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();


  if (!user) {

    document
      .getElementById("login-screen")
      .classList.remove("hidden");

    document
      .getElementById("admin-app")
      .classList.add("hidden");

    return;

  }


  const {
    data: profile,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id, full_name, phone, role, is_active"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Profile error:",
      error
    );

    alert(
      "Could not check admin profile:\n\n" +
      error.message
    );

    return;

  }


  if (
    !profile ||
    profile.role !== "admin" ||
    profile.is_active !== true
  ) {

    alert(
      "You do not have administrator access."
    );

    await supabaseClient.auth.signOut();

    return;

  }


  document
    .getElementById("login-screen")
    .classList.add("hidden");

  document
    .getElementById("admin-app")
    .classList.remove("hidden");


  document
    .getElementById("admin-info")
    .textContent =
      "Logged in as: " +
      (
        profile.full_name ||
        user.email
      );


  await loadQuoteRequests();

}

/* =========================================
   UPDATE CUSTOMER REQUEST STATUS
   ========================================= */

async function updateQuoteStatus(
  requestId
) {

  const select =
    document.getElementById(
      `request-status-${requestId}`
    );

  if (!select) {

    alert(
      "Status field not found."
    );

    return;

  }


  const newStatus =
    select.value;


  const {
    error
  } =
    await supabaseClient
      .from("quote_requests")
      .update({
        status: newStatus,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        requestId
      );


  if (error) {

    console.error(
      "Status update error:",
      error
    );

    alert(
      "Could not update request status:\n\n" +
      error.message
    );

    return;

  }


  alert(
    "Quote request status updated."
  );


  await loadQuoteRequests();

}



/* =========================================
   LOAD SUPPLIERS
   ========================================= */

async function loadSuppliers(
  requestId
) {

  const select =
    document.getElementById(
      `supplier-${requestId}`
    );


  if (!select) return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("suppliers")
      .select(`
        id,
        business_name,
        contact_name,
        is_active
      `)
      .eq(
        "is_active",
        true
      )
      .order(
        "business_name",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Supplier loading error:",
      error
    );

    select.innerHTML =
      `<option value="">
        Could not load suppliers
      </option>`;

    return;

  }


  select.innerHTML =
    `<option value="">
      Select Supplier
    </option>`;


  if (
    !data ||
    data.length === 0
  ) {

    select.innerHTML =
      `<option value="">
        No active suppliers found
      </option>`;

    return;

  }


  data.forEach(
    supplier => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        supplier.id;

      option.textContent =
        supplier.business_name ||
        supplier.contact_name ||
        supplier.id;

      select.appendChild(
        option
      );

    }
  );

}

          "]";

      }


      option.textContent =

      select.appendChild(
        option
      );

    }

}

  supplier_unit_price:
    unitPrice,

  supplier_total:
    supplierTotal,

  delivery_cost:
    deliveryCost,

  frosttech_margin_percent:
    marginPercent,

  frosttech_margin_amount:
    marginAmount,

  customer_total:
    customerTotal,

  customer_quote_status:
    "draft",

  notes:
    notes || null,

  valid_until:
    validUntilValue
      ? new Date(
          validUntilValue
        ).toISOString()
      : null,

  status:
    supplierStatus

};

  console.log(
    "SUPPLIER QUOTE:",
    supplierQuote
  );


  if (saveButton) {

    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("supplier_quotes")
      .insert(
        supplierQuote
      )
      .select()
      .single();


  if (error) {

    console.error(
      "SUPPLIER QUOTE ERROR:",
      error
    );


    alert(
      "Could not save supplier quotation.\n\n" +
      "Supabase error:\n" +
      error.message
    );


    if (saveButton) {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Save Supplier Quotation";

    }

    return;

  }


  console.log(
    "SUPPLIER QUOTE SAVED:",
    data
  );


  alert(
    "Supplier quotation saved successfully.\n\n" +
    "Supplier Total: ₦" +
    supplierTotal.toLocaleString()
  );


  supplierSelect.value =
    "";

  productSelect.value =
    "";

  unitPriceInput.value =
    "";

  deliveryInput.value =
    "0";

  validUntilInput.value =
    "";

  notesInput.value =
    "";


  calculateTotal(
    requestId
  );


  await loadSupplierQuotations(
    requestId
  );


  if (saveButton) {

    saveButton.disabled =
      false;

    saveButton.textContent =
      "Save Supplier Quotation";

  }

}



/* =========================================
   LOAD SAVED SUPPLIER QUOTATIONS
   ========================================= */

async function loadSupplierQuotations(
  requestId
) {

  const container =
    document.getElementById(
      `saved-quotes-${requestId}`
    );


  if (!container) return;


  container.innerHTML =
    "<p>Loading saved quotations...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("supplier_quotes")
      .select(`
        id,
        supplier_id,
        product_id,
        quantity,
        supplier_unit_price,
        supplier_total,
        delivery_cost,
        notes,
        valid_until,
        status,
        created_at
      `)
      .eq(
        "request_id",
        requestId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Saved quote error:",
      error
    );


    container.innerHTML =
      `<p class="error">
        Could not load saved quotations.<br><br>
        ${escapeHtml(error.message)}
      </p>`;


    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML =
      "<p>No supplier quotations saved yet.</p>";

    return;

  }


  container.innerHTML =
    "<h4>Saved Supplier Quotations</h4>";


  data.forEach(
    quote => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "saved-quote";


      div.innerHTML = `

        <p>
          <strong>Supplier ID:</strong><br>
          ${escapeHtml(
            quote.supplier_id
          )}
        </p>

        <p>
          <strong>Product ID:</strong><br>
          ${escapeHtml(
            quote.product_id ||
            "—"
          )}
        </p>

        <p>
          <strong>Quantity:</strong>
          ${Number(
            quote.quantity || 0
          )}
        </p>

        <p>
          <strong>Supplier Unit Price:</strong>
          ₦${Number(
            quote.supplier_unit_price || 0
          ).toLocaleString()}
        </p>

        <p>
          <strong>Delivery Cost:</strong>
          ₦${Number(
            quote.delivery_cost || 0
          ).toLocaleString()}
        </p>

        <p>
          <strong>Supplier Total:</strong>
          ₦${Number(
            quote.supplier_total || 0
          ).toLocaleString()}
        </p>

        <p>
          <strong>Status:</strong>
          ${escapeHtml(
            quote.status || "—"
          )}
        </p>

        <p>
          <strong>Valid Until:</strong>
          ${
            quote.valid_until
              ? new Date(
                  quote.valid_until
                ).toLocaleString()
              : "—"
          }
        </p>

        <p>
          <strong>Notes:</strong>
          ${escapeHtml(
            quote.notes || "—"
          )}
        </p>

      `;


      container.appendChild(
        div
      );

    }
  );

}



/* =========================================
   AUTOMATIC TOTAL CALCULATION
   ========================================= */

document.addEventListener(
  "input",
  function(event) {

    const id =
      event.target.id || "";


    if (
  id.startsWith(
    "quantity-"
  ) ||
  id.startsWith(
    "unit-price-"
  ) ||
  id.startsWith(
    "delivery-"
  ) ||
  id.startsWith(
    "margin-"
  )
) {

      const requestId =
        id.substring(
          id.indexOf("-") + 1
        );


      calculateTotal(
        requestId
      );

    }

  }
);



/* =========================================
   LOGOUT
   ========================================= */

async function logoutAdmin() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("admin-app")
    .classList.add("hidden");

  document
    .getElementById("login-screen")
    .classList.remove("hidden");

}



/* =========================================
   CHECK EXISTING SESSION
   ========================================= */

supabaseClient.auth.onAuthStateChange(
  async function(
    event,
    session
  ) {

    if (session) {

      await checkAdminAccess();

    }

  }
);


checkAdminAccess();
