<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FrostTech Admin</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 20px auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 5px;
      background: #0b5ed7;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #dc3545;
    }

    .success {
      background: #198754;
    }

    .secondary {
      background: #6c757d;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      background: #eee;
    }

    .request,
    .quotation {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 6px;
      background: #fafafa;
    }

    .selected {
      border: 2px solid #0b5ed7;
      background: #eef5ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .total-box {
      background: #f1f3f5;
      padding: 15px;
      margin-top: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .grand-total {
      font-size: 20px;
      font-weight: bold;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    .loading {
      color: #666;
    }

    .error {
      color: #dc3545;
      font-weight: bold;
    }

    .success-message {
      color: #198754;
      font-weight: bold;
    }

    @media (max-width: 700px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<!-- =========================================================
     LOGIN SCREEN
     ========================================================= -->

<div
  id="loginScreen"
  class="container"
>

  <div class="card">

    <h1>FrostTech HVAC and Refrigeration</h1>

    <h2>Admin Login</h2>

    <div id="loginMessage"></div>

    <label for="loginEmail">
      Email
    </label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin email"
      autocomplete="email"
    >


    <label for="loginPassword">
      Password
    </label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      type="button"
      id="loginButton"
      onclick="loginAdmin()"
    >
      Login
    </button>

  </div>

</div>



<!-- =========================================================
     ADMIN APPLICATION
     ========================================================= -->

<div
  id="adminApp"
  class="container hidden"
>

  <div class="card">

    <h1>
      FrostTech Admin Dashboard
    </h1>

    <p>
      Logged in as:
      <strong id="loggedInEmail"></strong>
    </p>

    <button
      type="button"
      class="danger"
      onclick="logoutAdmin()"
    >
      Logout
    </button>

  </div>



  <!-- =======================================================
       CUSTOMER QUOTE REQUESTS
       ======================================================= -->

  <div class="card">

    <h2>
      Customer Quote Requests
    </h2>

    <button
      type="button"
      class="secondary"
      onclick="loadQuoteRequests()"
    >
      Refresh Quote Requests
    </button>

    <div id="quoteRequestsList"></div>

  </div>



  <!-- =======================================================
       SELECTED REQUEST
       ======================================================= -->

  <div
    id="selectedRequestCard"
    class="card hidden"
  >

    <h2>
      Selected Customer Request
    </h2>

    <div id="selectedRequestDetails"></div>

  </div>



  <!-- =======================================================
       SUPPLIER QUOTATION
       ======================================================= -->

  <div
    id="supplierQuoteForm"
    class="card hidden"
  >

    <h2>
      Create Supplier Quotation
    </h2>

    <div id="quotationMessage"></div>


    <div class="grid">


      <!-- SUPPLIER -->

      <div>

        <label for="supplierSelect">
          Supplier
        </label>

        <select id="supplierSelect">

          <option value="">
            Select Supplier
          </option>

        </select>

      </div>


      <!-- PRODUCT -->

      <div>

        <label for="productSelect">
          Product
        </label>

        <select id="productSelect">

          <option value="">
            Select Product
          </option>

        </select>

      </div>


      <!-- QUANTITY -->

      <div>

        <label for="quantityInput">
          Quantity
        </label>

        <input
          type="number"
          id="quantityInput"
          value="1"
          min="1"
          step="1"
        >

      </div>


      <!-- UNIT PRICE -->

      <div>

        <label for="unitPriceInput">
          Supplier Unit Price
        </label>

        <input
          type="number"
          id="unitPriceInput"
          value="0"
          min="0"
          step="0.01"
        >

      </div>


      <!-- DELIVERY -->

      <div>

        <label for="deliveryInput">
          Delivery Cost
        </label>

        <input
          type="number"
          id="deliveryInput"
          value="0"
          min="0"
          step="0.01"
        >

      </div>


      <!-- MARGIN -->

      <div>

        <label for="marginInput">
          FrostTech Margin (%)
        </label>

        <input
          type="number"
          id="marginInput"
          value="15"
          min="0"
          step="0.01"
        >

      </div>


      <!-- STATUS -->

      <div>

        <label for="statusInput">
          Status
        </label>

        <select id="statusInput">

          <option value="draft">
            Draft
          </option>

          <option value="submitted">
            Submitted
          </option>

        </select>

      </div>


      <!-- VALID UNTIL -->

      <div>

        <label for="validUntilInput">
          Valid Until
        </label>

        <input
          type="date"
          id="validUntilInput"
        >

      </div>

    </div>



    <!-- NOTES -->

    <label for="notesInput">
      Notes
    </label>

    <textarea
      id="notesInput"
      placeholder="Supplier quotation notes"
    ></textarea>



    <!-- =====================================================
         QUOTATION CALCULATION
         ===================================================== -->

    <div class="total-box">

      <div class="total-row">

        <span>
          Supplier Total
        </span>

        <strong>
          ₦<span id="supplierTotalDisplay">
            0.00
          </span>
        </strong>

      </div>


      <div class="total-row">

        <span>
          FrostTech Margin
        </span>

        <strong>
          ₦<span id="marginDisplay">
            0.00
          </span>
        </strong>

      </div>


      <div class="total-row">

        <span>
          Delivery
        </span>

        <strong>
          ₦<span id="deliveryDisplay">
            0.00
          </span>
        </strong>

      </div>


      <div class="total-row grand-total">

        <span>
          Customer Total
        </span>

        <strong>
          ₦<span id="customerTotalDisplay">
            0.00
          </span>
        </strong>

      </div>

    </div>



    <button
      type="button"
      onclick="calculateQuotation()"
      class="secondary"
    >
      Calculate Quotation
    </button>


    <button
      type="button"
      onclick="saveSupplierQuotation()"
      class="success"
    >
      Save Supplier Quotation
    </button>

  </div>



  <!-- =======================================================
       SAVED SUPPLIER QUOTATIONS
       ======================================================= -->

  <div class="card">

    <h2>
      Saved Supplier Quotations
    </h2>

    <button
      type="button"
      class="secondary"
      onclick="loadSupplierQuotations()"
    >
      Refresh Supplier Quotations
    </button>

    <div id="savedSupplierQuotations"></div>

  </div>

</div>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>


/* =========================================================
   FROSTTECH SUPABASE CONFIGURATION
   ========================================================= */

const SUPABASE_URL =
  "PASTE YOUR EXISTING SUPABASE URL HERE";


const SUPABASE_PUBLISHABLE_KEY =
  "PASTE YOUR EXISTING SUPABASE PUBLISHABLE KEY HERE";


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let supabaseClient = null;

let ready = false;

let selectedRequestId = null;


/* =========================================================
   INITIALIZE SUPABASE
   ========================================================= */

function initializeSupabase() {

  try {

    console.log(
      "Starting FrostTech Supabase initialization..."
    );


    if (
      !SUPABASE_URL ||
      !SUPABASE_PUBLISHABLE_KEY ||
      SUPABASE_URL.includes("PASTE YOUR") ||
      SUPABASE_PUBLISHABLE_KEY.includes("PASTE YOUR")
    ) {

      console.error(
        "Supabase URL or publishable key has not been entered."
      );

      return false;
    }


    if (
      !window.supabase ||
      !window.supabase.createClient
    ) {

      console.error(
        "Supabase library did not load."
      );

      return false;
    }


    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    ready = true;


    console.log(
      "FrostTech Supabase initialized successfully."
    );


    return true;

  }

  catch (error) {

    console.error(
      "Supabase initialization error:",
      error
    );

    return false;
  }

}



/* =========================================================
   LOGIN
   ========================================================= */

async function loginAdmin() {

  console.log(
    "Login button clicked."
  );


  const message =
    document.getElementById(
      "loginMessage"
    );


  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if (!ready) {

    message.innerHTML =
      '<div class="error">' +
      'Supabase is not initialized. Please check your Supabase URL and publishable key.' +
      '</div>';

    console.error(
      "Login stopped because Supabase is not ready."
    );

    return;
  }


  if (!email || !password) {

    message.innerHTML =
      '<div class="error">' +
      'Please enter your email and password.' +
      '</div>';

    return;
  }


  message.innerHTML =
    '<div class="loading">' +
    'Logging in...' +
    '</div>';


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      console.error(
        "Login error:",
        error
      );

      message.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';

      return;
    }


    if (!data || !data.user) {

      message.innerHTML =
        '<div class="error">' +
        'Login failed. No user session was returned.' +
        '</div>';

      return;
    }


    console.log(
      "FrostTech Admin login successful."
    );


    message.innerHTML =
      '<div class="success-message">' +
      'Login successful.' +
      '</div>';


    showAdminApp(
      data.user
    );


    await loadQuoteRequests();

    await loadSuppliers();

    await loadProducts();

    await loadSupplierQuotations();

  }

  catch (error) {

    console.error(
      "Unexpected login error:",
      error
    );

    message.innerHTML =
      '<div class="error">' +
      'An unexpected error occurred during login.' +
      '</div>';

  }

}



/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession() {

  console.log(
    "Checking existing FrostTech session..."
  );


  if (!ready) {

    console.log(
      "Supabase is not ready. Session check skipped."
    );

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session check error:",
        error
      );

      return;
    }


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      console.log(
        "Existing FrostTech session found."
      );


      showAdminApp(
        data.session.user
      );


      await loadQuoteRequests();

      await loadSuppliers();

      await loadProducts();

      await loadSupplierQuotations();

    }

    else {

      console.log(
        "No active FrostTech session."
      );

      showLoginScreen();

    }

  }

  catch (error) {

    console.error(
      "Unexpected session error:",
      error
    );

  }

}



/* =========================================================
   SHOW LOGIN SCREEN
   ========================================================= */

function showLoginScreen() {

  document
    .getElementById("loginScreen")
    .classList
    .remove("hidden");


  document
    .getElementById("adminApp")
    .classList
    .add("hidden");

}



/* =========================================================
   SHOW ADMIN APPLICATION
   ========================================================= */

function showAdminApp(user) {

  document
    .getElementById("loginScreen")
    .classList
    .add("hidden");


  document
    .getElementById("adminApp")
    .classList
    .remove("hidden");


  const emailElement =
    document.getElementById(
      "loggedInEmail"
    );


  if (emailElement) {

    emailElement.textContent =
      user.email || "";

  }

}



/* =========================================================
   LOGOUT
   ========================================================= */

async function logoutAdmin() {

  if (!ready) {

    return;
  }


  try {

    const {
      error
    } =
      await supabaseClient.auth.signOut();


    if (error) {

      console.error(
        "Logout error:",
        error
      );

      return;
    }


    console.log(
      "FrostTech Admin logged out."
    );


    selectedRequestId = null;


    showLoginScreen();


  }

  catch (error) {

    console.error(
      "Unexpected logout error:",
      error
    );

  }

}



/* =========================================================
   LOAD QUOTE REQUESTS
   ========================================================= */

async function loadQuoteRequests() {

  const list =
    document.getElementById(
      "quoteRequestsList"
    );


  if (!ready) {

    list.innerHTML =
      '<div class="error">' +
      'Supabase is not ready.' +
      '</div>';

    return;
  }


  list.innerHTML =
    '<div class="loading">' +
    'Loading quote requests...' +
    '</div>';


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("quote_requests")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Quote request error:",
        error
      );

      list.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<p>No customer quote requests found.</p>';

      return;
    }


    list.innerHTML = "";


    data.forEach(
      function(request) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "request";


        div.innerHTML = `

          <h3>
            Customer Quote Request
          </h3>

          <p>
            <strong>Request ID:</strong>
            ${request.id || ""}
          </p>

          <p>
            <strong>Status:</strong>
            ${request.status || ""}
          </p>

          <p>
            <strong>Created:</strong>
            ${request.created_at || ""}
          </p>

          <button
            type="button"
            onclick="selectQuoteRequest('${request.id}')"
          >
            Select Request
          </button>

        `;


        list.appendChild(
          div
        );

      }
    );

  }

  catch (error) {

    console.error(
      "Unexpected quote request error:",
      error
    );

    list.innerHTML =
      '<div class="error">' +
      'Unable to load quote requests.' +
      '</div>';

  }

}



/* =========================================================
   SELECT QUOTE REQUEST
   ========================================================= */

async function selectQuoteRequest(
  requestId
) {

  selectedRequestId =
    requestId;


  const card =
    document.getElementById(
      "selectedRequestCard"
    );


  const details =
    document.getElementById(
      "selectedRequestDetails"
    );


  const form =
    document.getElementById(
      "supplierQuoteForm"
    );


  card.classList.remove(
    "hidden"
  );


  form.classList.remove(
    "hidden"
  );


  details.innerHTML =
    "<p>Loading request...</p>";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("quote_requests")
        .select("*")
        .eq(
          "id",
          requestId
        )
        .single();


    if (error) {

      console.error(
        "Selected request error:",
        error
      );

      details.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';

      return;
    }


    details.innerHTML = `

      <p>
        <strong>Request ID:</strong>
        ${data.id || ""}
      </p>

      <p>
        <strong>Status:</strong>
        ${data.status || ""}
      </p>

      <p>
        <strong>Created:</strong>
        ${data.created_at || ""}
      </p>

    `;

  }

  catch (error) {

    console.error(
      "Unexpected request selection error:",
      error
    );

    details.innerHTML =
      '<div class="error">' +
      'Unable to load selected request.' +
      '</div>';

  }

}



/* =========================================================
   LOAD SUPPLIERS
   ========================================================= */

async function loadSuppliers() {

  const select =
    document.getElementById(
      "supplierSelect"
    );


  if (!ready || !select) {

    return;
  }


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("suppliers")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Supplier quotation loading error:",
        error
      );

      list.innerHTML =
        '<div class="error">' +
        error.message +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<p>No supplier quotations found.</p>';

      return;
    }


    list.innerHTML = "";


    data.forEach(
      function(quote) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "quotation";


        div.innerHTML = `

          <h3>
            Supplier Quotation
          </h3>

          <p>
            <strong>Quotation ID:</strong>
            ${quote.id || ""}
          </p>

          <p>
            <strong>Status:</strong>
            ${quote.status || ""}
          </p>

          <p>
            <strong>Quantity:</strong>
            ${quote.quantity || 0}
          </p>

          <p>
            <strong>Supplier Unit Price:</strong>
            ₦${Number(
              quote.supplier_unit_price || 0
            ).toFixed(2)}
          </p>

          <p>
            <strong>Supplier Total:</strong>
            ₦${Number(
              quote.supplier_total || 0
            ).toFixed(2)}
          </p>

          <p>
            <strong>FrostTech Margin:</strong>
            ₦${Number(
              quote.frosttech_margin_amount || 0
            ).toFixed(2)}
          </p>

          <p>
            <strong>Customer Total:</strong>
            ₦${Number(
              quote.customer_total || 0
            ).toFixed(2)}
          </p>

        `;


        list.appendChild(
          div
        );

      }
    );

  }

  catch (error) {

    console.error(
      "Unexpected quotation loading error:",
      error
    );

    list.innerHTML =
      '<div class="error">' +
      'Unable to load supplier quotations.' +
      '</div>';

  }

}



/* =========================================================
   AUTO-CALCULATE WHEN VALUES CHANGE
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const calculationInputs = [

      "quantityInput",

      "unitPriceInput",

      "deliveryInput",

      "marginInput"

    ];


    calculationInputs.forEach(
      function(id) {

        const element =
          document.getElementById(id);


        if (element) {

          element.addEventListener(
            "input",
            calculateQuotation
          );

        }

      }
    );

  }
);



/* =========================================================
   PAGE START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    console.log(
      "FrostTech Admin JavaScript loaded successfully."
    );


    const initialized =
      initializeSupabase();


    if (!initialized) {

      console.error(
        "FrostTech Admin could not initialize Supabase."
      );

      return;
    }


    await checkSession();

  }
);


</script>


</body>

</html>
