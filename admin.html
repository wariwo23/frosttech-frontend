  <!-- =====================================================
       SECTION 3
       ADMIN LOGIN
       ===================================================== -->

  <hr>

  <h2>
    Admin Login
  </h2>


  <!-- EMAIL -->

  <label for="adminEmail">
    Email
  </label>

  <br>

  <input
    type="email"
    id="adminEmail"
    placeholder="Enter admin email"
    autocomplete="username"
  >


  <br><br>


  <!-- PASSWORD -->

  <label for="adminPassword">
    Password
  </label>

  <br>

  <input
    type="password"
    id="adminPassword"
    placeholder="Enter admin password"
    autocomplete="current-password"
  >


  <br><br>


  <!-- LOGIN BUTTON -->

  <button
    type="button"
    id="adminLoginButton"
  >
    Login
  </button>


  <!-- LOGIN MESSAGE -->

  <p id="loginMessage"></p>


  <!-- =====================================================
       SECTION 3C
       SUPABASE AUTHENTICATION
       ===================================================== -->

  <script>

    document
      .getElementById("adminLoginButton")
      .addEventListener(
        "click",
        async function () {


          console.log(
            "FrostTech Admin Login button clicked."
          );


          const email =
            document
              .getElementById("adminEmail")
              .value
              .trim();


          const password =
            document
              .getElementById("adminPassword")
              .value;


          const loginMessage =
            document.getElementById(
              "loginMessage"
            );


          /* =================================================
             CHECK EMAIL
             ================================================= */

          if (!email) {

            loginMessage.textContent =
              "Please enter your admin email.";

            return;

          }


          /* =================================================
             CHECK PASSWORD
             ================================================= */

          if (!password) {

            loginMessage.textContent =
              "Please enter your admin password.";

            return;

          }


          /* =================================================
             SHOW LOGIN STATUS
             ================================================= */

          loginMessage.textContent =
            "Logging in...";


          /* =================================================
             DISABLE BUTTON WHILE LOGIN IS PROCESSING
             ================================================= */

          const loginButton =
            document.getElementById(
              "adminLoginButton"
            );


          loginButton.disabled = true;


          loginButton.textContent =
            "Logging in...";


          try {


            /* ===============================================
               SUPABASE AUTHENTICATION
               =============================================== */

            const {
              data,
              error
            } =
              await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

              });


            /* ===============================================
               LOGIN ERROR
               =============================================== */

            if (error) {

              console.error(
                "FrostTech login error:",
                error
              );


              loginMessage.textContent =
                "Login failed: " +
                error.message;


              loginButton.disabled = false;

              loginButton.textContent =
                "Login";


              return;

            }


            /* ===============================================
               LOGIN SUCCESS
               =============================================== */

            console.log(
              "FrostTech admin login successful.",
              data
            );


            loginMessage.textContent =
              "Admin login successful.";


            loginButton.textContent =
              "Logged In";


            loginButton.disabled = true;


          }

          catch (error) {


            console.error(
              "Unexpected FrostTech login error:",
              error
            );


            loginMessage.textContent =
              "An unexpected error occurred. Please try again.";


            loginButton.disabled = false;

            loginButton.textContent =
              "Login";


          }


        }
      );


  </script>
