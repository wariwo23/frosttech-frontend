<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrostTech Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f7f9;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0052a3;
    }

    .hidden {
      display: none;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .quote {
      border-top: 1px solid #ddd;
      padding-top: 20px;
      margin-top: 20px;
    }

    .quote-details {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .supplier-quotes {
      background: #eef6ff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>FrostTech HVAC and Refrigeration</h1>
  <h2>Admin Dashboard</h2>

  <!-- LOGIN -->
  <div id="login-section" class="card">
    <h3>Admin Login</h3>

    <label>Email</label>
    <input type="email" id="email" placeholder="Admin email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="login-message"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-section" class="hidden">

    <div class="card">
      <p>
        <strong>Logged in as:</strong>
        <span id="admin-name"></span>
        |
        <strong>Role:</strong>
        <span id="admin-role"></span>
      </p>

      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Customer Quote Requests</h2>

      <div id="quote-requests">
        Loading quote requests...
      </div>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL = "https://nftxptjpgidcsgtaltjn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "[KEY]";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   LOGIN
========================= */

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const message = document.getElementById("login-message");

  if (!email || !password) {
    message.className = "error";
    message.textContent = "Please enter your email and password.";
    return;
  }

  message.textContent = "Logging in...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.className = "error";
    message.textContent = error.message;
    return;
  }

  message.className = "success";
  message.textContent = "Login successful.";

  await checkAdminAccess();
}


/* =========================
   CHECK ADMIN
========================= */

async function checkAdminAccess() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    document.getElementById("login-section").classList.remove("hidden");
    document.getElementById("dashboard-section").classList.add("hidden");
    return;
  }

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("full_name, role, is_active")
    .eq("id", user.id)
    .single();

  if (error) {
    document.getElementById("login-message").className = "error";
    document.getElementById("login-message").textContent =
      "Profile check failed: " + error.message;
    return;
  }

  if (profile.role !== "admin" || profile.is_active !== true) {
    document.getElementById("login-message").className = "error";
    document.getElementById("login-message").textContent =
      "Access denied.";
    return;
  }

  document.getElementById("admin-name").textContent =
    profile.full_name || "Admin";

  document.getElementById("admin-role").textContent =
    profile.role;

  document.getElementById("login-section").classList.add("hidden");
  document.getElementById("dashboard-section").classList.remove("hidden");

  await loadQuoteRequests();
}


/* =========================
   LOAD QUOTE REQUESTS
========================= */

async function loadQuoteRequests() {

  const container = document.getElementById("quote-requests");

  container.innerHTML = "Loading quote requests...";

  const { data, error } = await supabaseClient
    .from("quote_requests")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    container.innerHTML =
      '<p class="error">Error loading quote requests: ' +
      error.message +
      '</p>';

    return;
  }

  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No quote requests found.</p>";

    return;
  }

  container.innerHTML = "";

  data.forEach(request => {

    const div = document.createElement("div");

    div.className = "quote card";

    div.innerHTML = `

      <h3>${escapeHtml(request.title || "Quote Request")}</h3>

      <div class="quote-details">

        <p>
          <strong>Request Number:</strong>
          ${escapeHtml(request.request_number || "")}
        </p>

        <p>
          <strong>Description:</strong>
          ${escapeHtml(request.description || "")}
        </p>

        <p>
          <strong>Category:</strong>
          ${escapeHtml(request.category || "")}
        </p>

        <p>
          <strong>Quantity:</strong>
          ${request.quantity ?? ""}
        </p>

        <p>
          <strong>Preferred Brand:</strong>
          ${escapeHtml(request.preferred_brand || "")}
        </p>

        <p>
          <strong>Budget:</strong>
          ${request.budget ?? ""}
        </p>

        <p>
          <strong>Delivery Address:</strong>
          ${escapeHtml(request.delivery_address || "")}
        </p>

        <label>Status</label>

        <select id="status-${request.id}">
          <option value="pending">Pending</option>
          <option value="reviewing">Reviewing</option>
          <option value="quoted">Quoted</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>

        <button onclick="updateQuoteStatus('${request.id}')">
          Save Status
        </button>

      </div>

      <div class="supplier-quotes">

        <h3>Supplier Quotation</h3>

        <label>Supplier ID</label>
        <input
          id="supplier-${request.id}"
          placeholder="Supplier UUID"
        >

        <label>Product ID</label>
        <input
          id="product-${request.id}"
          placeholder="Product UUID"
        >

        <label>Quantity</label>
        <input
          id="quantity-${request.id}"
          type="number"
          value="${request.quantity || 1}"
          min="1"
        >

        <label>Supplier Unit Price</label>
        <input
          id="unit-price-${request.id}"
          type="number"
          placeholder="Supplier price"
        >

        <label>Delivery Cost</label>
        <input
          id="delivery-${request.id}"
          type="number"
          value="0"
        >

        <label>Valid Until</label>
        <input
          id="valid-${request.id}"
          type="datetime-local"
        >

        <label>Supplier Notes</label>
        <textarea
          id="notes-${request.id}"
          placeholder="Supplier notes"
        ></textarea>

        <button onclick="saveSupplierQuotation('${request.id}')">
          Save Supplier Quotation
        </button>

        <div id="saved-quotes-${request.id}">
          Loading supplier quotations...
        </div>

      </div>
    `;

    container.appendChild(div);

    document.getElementById(`status-${request.id}`).value =
      request.status || "pending";

    loadSupplierQuotations(request.id);
  });
}


/* =========================
   UPDATE REQUEST STATUS
========================= */

async function updateQuoteStatus(requestId) {

  const status =
    document.getElementById(`status-${requestId}`).value;

  const { error } = await supabaseClient
    .from("quote_requests")
    .update({
      status: status,
      updated_at: new Date().toISOString()
    })
    .eq("id", requestId);

  if (error) {
    alert("Could not update status: " + error.message);
    return;
  }

  alert("Quote request status updated.");
}


/* =========================
   SAVE SUPPLIER QUOTATION
========================= */

async function saveSupplierQuotation(requestId) {

  const supplierId =
    document.getElementById(`supplier-${requestId}`).value.trim();

  const productId =
    document.getElementById(`product-${requestId}`).value.trim();

  const quantity =
    Number(document.getElementById(`quantity-${requestId}`).value);

  const unitPrice =
    Number(document.getElementById(`unit-price-${requestId}`).value);

  const deliveryCost =
    Number(document.getElementById(`delivery-${requestId}`).value || 0);

  const validUntil =
    document.getElementById(`valid-${requestId}`).value;

  const notes =
    document.getElementById(`notes-${requestId}`).value.trim();

  if (!supplierId || !productId || !quantity || !unitPrice) {
    alert(
      "Please enter Supplier ID, Product ID, Quantity and Supplier Unit Price."
    );
    return;
  }

  const supplierTotal =
    (quantity * unitPrice) + deliveryCost;

  const { error } = await supabaseClient
    .from("supplier_quotes")
    .insert({
      request_id: requestId,
      supplier_id: supplierId,
      product_id: productId,
      quantity: quantity,
      supplier_unit_price: unitPrice,
      supplier_total: supplierTotal,
      delivery_cost: deliveryCost,
      notes: notes || null,
      valid_until: validUntil
        ? new Date(validUntil).toISOString()
        : null,
      status: "submitted",
      updated_at: new Date().toISOString()
    });

  if (error) {

    alert(
      "Could not save supplier quotation: " +
      error.message
    );

    return;
  }

  alert(
    "Supplier quotation saved. Total: ₦" +
    supplierTotal.toLocaleString()
  );

  await loadSupplierQuotations(requestId);
}


/* =========================
   LOAD SUPPLIER QUOTATIONS
========================= */

async function loadSupplierQuotations(requestId) {

  const container =
    document.getElementById(`saved-quotes-${requestId}`);

  if (!container) return;

  const { data, error } = await supabaseClient
    .from("supplier_quotes")
    .select("*")
    .eq("request_id", requestId)
    .order("created_at", { ascending: false });

  if (error) {

    container.innerHTML =
      '<p class="error">Could not load supplier quotations: ' +
      error.message +
      '</p>';

    return;
  }

  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>No supplier quotations saved yet.</p>";

    return;
  }

  container.innerHTML =
    "<h4>Saved Supplier Quotations</h4>";

  data.forEach(quote => {

    const div = document.createElement("div");

    div.style.background = "white";
    div.style.padding = "10px";
    div.style.marginTop = "10px";
    div.style.borderRadius = "6px";

    div.innerHTML = `
      <p><strong>Supplier:</strong>
        ${escapeHtml(quote.supplier_id)}
      </p>

      <p><strong>Product:</strong>
        ${escapeHtml(quote.product_id)}
      </p>

      <p><strong>Quantity:</strong>
        ${quote.quantity}
      </p>

      <p><strong>Unit Price:</strong>
        ₦${Number(quote.supplier_unit_price).toLocaleString()}
      </p>

      <p><strong>Delivery:</strong>
        ₦${Number(quote.delivery_cost || 0).toLocaleString()}
      </p>

      <p><strong>Total:</strong>
        ₦${Number(quote.supplier_total).toLocaleString()}
      </p>

      <p><strong>Status:</strong>
        ${escapeHtml(quote.status || "")}
      </p>

      <p><strong>Notes:</strong>
        ${escapeHtml(quote.notes || "")}
      </p>
    `;

    container.appendChild(div);
  });
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();
}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

checkAdminAccess();

</script>

</body>
  </html>
