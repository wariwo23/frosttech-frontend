<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FrostTech Admin</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0b3d91;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 20px auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input,
    select,
    button,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #0b3d91;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #082f70;
    }

    .logout-button {
      background: #b00020;
    }

    .logout-button:hover {
      background: #870018;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .quote-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      background: #fafafa;
    }

    .quote-card h3 {
      margin-top: 0;
      color: #0b3d91;
    }

    .supplier-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      background: #fff;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: #0b3d91;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

  </style>

</head>


<body>


<header>

  <h1>FrostTech Admin</h1>

  <p>
    HVAC and Refrigeration Marketplace
  </p>

</header>


<div class="container">


  <!-- SYSTEM STATUS -->

  <div class="card">

    <h2>System Status</h2>

    <p id="systemStatus">
      Admin system loading...
    </p>

  </div>


  <!-- LOGIN -->

  <div
    class="card"
    id="loginSection"
  >

    <h2>Admin Login</h2>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
      autocomplete="username"
    >


    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      type="button"
      id="loginButton"
    >
      Login
    </button>


    <p id="loginMessage"></p>

  </div>


  <!-- ADMIN DASHBOARD -->

  <div
    class="hidden"
    id="dashboard"
  >


    <div class="card">

      <h2>Admin Dashboard</h2>

      <p id="adminUser"></p>

      <button
        type="button"
        class="logout-button"
        id="logoutButton"
      >
        Logout
      </button>

    </div>


    <!-- CUSTOMER QUOTE REQUESTS -->

    <div class="card">

      <h2>Customer Quote Requests</h2>

      <button
        type="button"
        id="refreshRequestsButton"
      >
        Refresh Requests
      </button>

      <div id="requestsContainer">
        Loading requests...
      </div>

    </div>


    <!-- SUPPLIER QUOTATIONS -->

    <div class="card">

      <h2>Saved Supplier Quotations</h2>

      <button
        type="button"
        id="refreshSupplierQuotesButton"
      >
        Refresh Supplier Quotations
      </button>

      <div id="supplierQuotesContainer">
        Loading supplier quotations...
      </div>

    </div>


  </div>


</div>


<script>

  /*
   =========================================================
   FROSTTECH SUPABASE CONFIGURATION
   =========================================================
  */

  const SUPABASE_URL =
    "https://nftxptjpgidcsgtaltjn.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_9b9QzhXqSJflCKDUc2sQnA_p4f0pblV";


  /*
   =========================================================
   SUPABASE INITIALIZATION
   =========================================================
  */

  let supabaseClient = null;


  function initializeSupabase() {

    try {

      if (!window.supabase) {

        throw new Error(
          "Supabase library did not load."
        );

      }


      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );


      document.getElementById(
        "systemStatus"
      ).textContent =
        "Supabase connection initialized successfully.";

      document.getElementById(
        "systemStatus"
      ).className =
        "success";


      console.log(
        "FrostTech Supabase initialized."
      );


      return true;

    }

    catch (error) {

      console.error(
        "Supabase initialization error:",
        error
      );


      document.getElementById(
        "systemStatus"
      ).textContent =
        "Supabase initialization failed: " +
        error.message;


      document.getElementById(
        "systemStatus"
      ).className =
        "error";


      return false;

    }

  }


  /*
   =========================================================
   ADMIN LOGIN
   =========================================================
  */

  async function loginAdmin() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();


    const password =
      document.getElementById(
        "password"
      ).value;


    const message =
      document.getElementById(
        "loginMessage"
      );


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      message.className =
        "error";

      return;

    }


    message.textContent =
      "Logging in...";

    message.className =
      "";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        throw error;

      }


      if (!data || !data.user) {

        throw new Error(
          "Login succeeded but no user was returned."
        );

      }


      console.log(
        "Supabase login successful:",
        data.user.email
      );


      await checkAdminProfile(
        data.user
      );

    }

    catch (error) {

      console.error(
        "Login error:",
        error
      );


      message.textContent =
        "Login failed: " +
        error.message;


      message.className =
        "error";

    }

  }


  /*
   =========================================================
   CHECK ADMIN PROFILE
   =========================================================
  */

  async function checkAdminProfile(user) {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, full_name, role, is_active"
          )
          .eq(
            "id",
            user.id
          )
          .single();


      if (error) {

        throw error;

      }


      if (!data) {

        throw new Error(
          "Admin profile was not found."
        );

      }


      if (data.role !== "admin") {

        throw new Error(
          "This account is not an admin account."
        );

      }


      if (data.is_active !== true) {

        throw new Error(
          "This admin account is not active."
        );

      }


      document.getElementById(
        "loginMessage"
      ).textContent =
        "Login successful.";


      document.getElementById(
        "loginMessage"
      ).className =
        "success";


      showDashboard(
        user,
        data
      );

    }

    catch (error) {

      console.error(
        "Admin profile error:",
        error
      );


      await supabaseClient.auth.signOut();


      document.getElementById(
        "loginMessage"
      ).textContent =
        "Admin verification failed: " +
        error.message;


      document.getElementById(
        "loginMessage"
      ).className =
        "error";

    }

  }


  /*
   =========================================================
   SHOW DASHBOARD
   =========================================================
  */

  function showDashboard(
    user,
    profile
  ) {

    document.getElementById(
      "loginSection"
    ).classList.add(
      "hidden"
    );


    document.getElementById(
      "dashboard"
    ).classList.remove(
      "hidden"
    );


    document.getElementById(
      "adminUser"
    ).textContent =
      "Logged in as: " +
      (
        profile.full_name ||
        user.email
      ) +
      " (" +
      user.email +
      ")";


    loadQuoteRequests();

    loadSupplierQuotes();

  }


  /*
   =========================================================
   CHECK EXISTING SESSION
   =========================================================
  */

  async function checkSession() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        throw error;

      }


      const session =
        data.session;


      if (!session) {

        console.log(
          "No active admin session."
        );

        return;

      }


      console.log(
        "Existing session found."
      );


      await checkAdminProfile(
        session.user
      );

    }

    catch (error) {

      console.error(
        "Session check failed:",
        error
      );

    }

  }


  /*
   =========================================================
   LOGOUT
   =========================================================
  */

  async function logoutAdmin() {

    try {

      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if (error) {

        throw error;

      }


      document.getElementById(
        "dashboard"
      ).classList.add(
        "hidden"
      );


      document.getElementById(
        "loginSection"
      ).classList.remove(
        "hidden"
      );


      document.getElementById(
        "loginMessage"
      ).textContent =
        "Logged out successfully.";


      document.getElementById(
        "loginMessage"
      ).className =
        "success";


      document.getElementById(
        "password"
      ).value = "";


    }

    catch (error) {

      console.error(
        "Logout error:",
        error
      );

    }

  }


  /*
   =========================================================
   LOAD CUSTOMER QUOTE REQUESTS
   =========================================================
  */

  async function loadQuoteRequests() {

    const container =
      document.getElementById(
        "requestsContainer"
      );


    container.innerHTML =
      "Loading requests...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("quote_requests")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        throw error;

      }


      if (!data || data.length === 0) {

        container.innerHTML =
          "<p>No customer quote requests found.</p>";

        return;

      }


      container.innerHTML = "";


      data.forEach(
        request => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "quote-card";


          card.innerHTML = `

            <h3>
              Request ${
                request.request_number ||
                request.id
              }
            </h3>

            <p>
              <strong>Status:</strong>
              ${
                request.status ||
                "N/A"
              }
            </p>

            <p>
              <strong>Customer:</strong>
              ${
                request.customer_name ||
                request.name ||
                "N/A"
              }
            </p>

            <p>
              <strong>Phone:</strong>
              ${
                request.phone ||
                request.customer_phone ||
                "N/A"
              }
            </p>

            <p>
              <strong>Product:</strong>
              ${
                request.product_name ||
                "N/A"
              }
            </p>

            <p>
              <strong>Quantity:</strong>
              ${
                request.quantity ||
                "N/A"
              }
            </p>

            <p>
              <strong>Delivery Address:</strong>
              ${
                request.delivery_address ||
                "N/A"
              }
            </p>

            <p class="small">
              Request ID:
              ${request.id}
            </p>

          `;


          container.appendChild(
            card
          );

        }
      );

    }

    catch (error) {

      console.error(
        "Quote request error:",
        error
      );


      container.innerHTML =
        `
        <p class="error">
          Could not load quote requests:
          ${error.message}
        </p>
        `;

    }

  }


  /*
   =========================================================
   LOAD SUPPLIER QUOTATIONS
   =========================================================
  */

  async function loadSupplierQuotes() {

    const container =
      document.getElementById(
        "supplierQuotesContainer"
      );


    container.innerHTML =
      "Loading supplier quotations...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("supplier_quotes")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        throw error;

      }


      if (!data || data.length === 0) {

        container.innerHTML =
          "<p>No supplier quotations found.</p>";

        return;

      }


      container.innerHTML = "";


      data.forEach(
        quote => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "supplier-card";


          const supplierTotal =
            Number(
              quote.supplier_total || 0
            );


          const deliveryCost =
            Number(
              quote.delivery_cost || 0
            );


          const marginAmount =
            Number(
              quote.frosttech_margin_amount || 0
            );


          const customerTotal =
            Number(
              quote.customer_total || 0
            );


          card.innerHTML = `

            <h3>
              Supplier Quotation
            </h3>

            <p>
              <strong>Status:</strong>
              ${
                quote.status ||
                "N/A"
              }
            </p>

            <p>
              <strong>Supplier ID:</strong>
              ${
                quote.supplier_id ||
                "N/A"
              }
            </p>

            <p>
              <strong>Product ID:</strong>
              ${
                quote.product_id ||
                "N/A"
              }
            </p>

            <p>
              <strong>Quantity:</strong>
              ${
                quote.quantity ||
                0
              }
            </p>

            <p>
              <strong>Supplier Total:</strong>
              ₦${supplierTotal.toLocaleString()}
            </p>

            <p>
              <strong>Delivery Cost:</strong>
              ₦${deliveryCost.toLocaleString()}
            </p>

            <p>
              <strong>FrostTech Margin:</strong>
              ${
                quote.frosttech_margin_percent ||
                0
              }%
              =
              ₦${marginAmount.toLocaleString()}
            </p>

            <p class="total">
              Customer Total:
              ₦${customerTotal.toLocaleString()}
            </p>

            <p>
              <strong>Customer Quote Status:</strong>
              ${
                quote.customer_quote_status ||
                "N/A"
              }
            </p>

            <p>
              <strong>Valid Until:</strong>
              ${
                quote.valid_until ||
                "N/A"
              }
            </p>

            <p>
              ${
                quote.notes ||
                ""
              }
            </p>

            <p class="small">
              Quote ID:
              ${quote.id}
            </p>

          `;


          container.appendChild(
            card
          );

        }
      );

    }

    catch (error) {

      console.error(
        "Supplier quote error:",
        error
      );


      container.innerHTML =
        `
        <p class="error">
          Could not load supplier quotations:
          ${error.message}
        </p>
        `;

    }

  }


  /*
   =========================================================
   BUTTON EVENT LISTENERS
   =========================================================
  */

  document.addEventListener(
    "DOMContentLoaded",
    async function () {

      console.log(
        "FrostTech Admin JavaScript loaded successfully."
      );


      const ready =
        initializeSupabase();


      if (!ready) {

        return;

      }


      document
        .getElementById(
          "loginButton"
        )
        .addEventListener(
          "click",
          loginAdmin
        );


      document
        .getElementById(
          "logoutButton"
        )
        .addEventListener(
          "click",
          logoutAdmin
        );


      document
        .getElementById(
          "refreshRequestsButton"
        )
        .addEventListener(
          "click",
          loadQuoteRequests
        );


      document
        .getElementById(
          "refreshSupplierQuotesButton"
        )
        .addEventListener(
          "click",
          loadSupplierQuotes
        );


      document
        .getElementById(
          "password"
        )
        .addEventListener(
          "keydown",
          function (event) {

            if (
              event.key === "Enter"
            ) {

              loginAdmin();

            }

          }
        );


      await checkSession();

    }
  );


</script>


</body>

  </html>
