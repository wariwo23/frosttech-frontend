  <title>FrostTech Admin</title>  <link rel="stylesheet" href="style.css">  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>  <script src="supabase.js"></script></head><body>  <header class="site-header"><div class="container">

  <h1>
    FrostTech HVAC and Refrigeration
  </h1>

  <p>
    Admin Dashboard
  </p>

</div>

  </header>  <main class="container"><h2>Admin Login</h2>

<p>
  Login to access the FrostTech administration dashboard.
</p>


<input
  id="email"
  type="email"
  placeholder="Admin email"
  style="display:block;width:100%;max-width:400px;padding:12px;margin:10px 0;"
>


<input
  id="password"
  type="password"
  placeholder="Password"
  style="display:block;width:100%;max-width:400px;padding:12px;margin:10px 0;"
>


<button
  onclick="login()"
  style="padding:12px 25px;"
>
  Login
</button>


<p id="message"></p>

  </main>  <script>

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      message.textContent =
        "Logging in...";


      const loginResult =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


      if (loginResult.error) {

        message.textContent =
          "Login failed: " +
          loginResult.error.message;

        return;
      }


      message.textContent =
        "Login successful. Checking admin profile...";


      const userResult =
        await supabaseClient.auth.getUser();


      if (
        userResult.error ||
        !userResult.data.user
      ) {

        message.textContent =
          "Login worked, but user session was not found.";

        return;
      }


      const userId =
        userResult.data.user.id;


      const profileResult =
        await supabaseClient
          .from("profiles")
          .select(
            "full_name, role, is_active"
          )
          .eq("id", userId)
          .single();


      if (profileResult.error) {

        message.textContent =
          "Profile check failed: " +
          profileResult.error.message;

        return;
      }


      const profile =
        profileResult.data;


      message.textContent =
        "Logged in as: " +
        (profile.full_name || "Admin") +
        " | Role: " +
        profile.role +
        " | Active: " +
        profile.is_active;

    }

  </script></body></html>
