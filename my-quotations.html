<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Quotations | FrostTech</title>

  <meta
    name="description"
    content="View your FrostTech quotations and securely pay the administration fee."
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --blue: #0759b8;
      --dark-blue: #063d7a;
      --light-blue: #eaf3ff;
      --green: #137547;
      --red: #b42318;
      --text: #172033;
      --muted: #64748b;
      --border: #dce4ee;
      --background: #f4f7fb;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    header {
      background: var(--dark-blue);
      color: white;
      padding: 20px 16px;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
      font-weight: 800;
    }

    header p {
      margin: 5px 0 0;
      color: #d8e9ff;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 14px 40px;
    }

    .intro,
    .quotation-card,
    .notice {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .intro h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button,
    .button-link {
      display: inline-block;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .primary-button {
      background: var(--blue);
      color: white;
    }

    .primary-button:hover {
      background: var(--dark-blue);
    }

    .secondary-button {
      background: #e8eef6;
      color: var(--text);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .quotation-card h3 {
      margin: 0 0 5px;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .reference {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      margin: 10px 0;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: #fff2cc;
      color: #805500;
    }

    .status-paid {
      background: #d9f7e5;
      color: #11613a;
    }

    .status-error {
      background: #fee4e2;
      color: var(--red);
    }

    .fee-panel {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: var(--light-blue);
      border: 1px solid #c8ddff;
    }

    .fee-panel p {
      margin: 5px 0;
    }

    .fee-amount {
      font-size: 22px;
      font-weight: 800;
      color: var(--dark-blue);
    }

    .details {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 1px solid #edf1f6;
    }

    .detail-row span:first-child {
      color: var(--muted);
    }

    .detail-row span:last-child {
      text-align: right;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .total-row {
      font-size: 17px;
      font-weight: 800;
      border-bottom: 0;
    }

    .message {
      padding: 13px;
      border-radius: 8px;
      background: #eaf3ff;
      color: var(--dark-blue);
      margin-bottom: 15px;
      overflow-wrap: anywhere;
    }

    .message.error {
      background: #fee4e2;
      color: var(--red);
    }

    .message.success {
      background: #d9f7e5;
      color: #11613a;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 20px 14px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 21px;
      }

      .quotation-card,
      .intro,
      .notice {
        padding: 14px;
      }

      .detail-row {
        gap: 10px;
      }

      .detail-row span:last-child {
        max-width: 60%;
      }

      .toolbar button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>FrostTech HVAC & Refrigeration</h1>
    <p>My Quotations</p>
  </div>
</header>

<main>

  <section class="intro">
    <h2>Your Quotations</h2>
    <p>
      Review your quotation status and pay the administration fee
      securely before viewing the complete quotation.
    </p>

    <div class="toolbar">
      <button
        id="refreshButton"
        class="primary-button"
        type="button"
      >
        Refresh Quotations
      </button>

      <button
        id="signOutButton"
        class="secondary-button"
        type="button"
      >
        Sign Out
      </button>
    </div>
  </section>

  <div id="message" class="message hidden" role="status"></div>

  <section id="quotationsContainer" aria-live="polite">
    <div class="notice">Loading your quotations...</div>
  </section>

</main>

<footer>
  &copy; <span id="currentYear"></span>
  FrostTech HVAC and Refrigeration.
  All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase.js"></script>

<script>
(() => {
  "use strict";

  const db = window.supabaseClient;

  const container = document.getElementById("quotationsContainer");
  const messageBox = document.getElementById("message");
  const refreshButton = document.getElementById("refreshButton");
  const signOutButton = document.getElementById("signOutButton");

  document.getElementById("currentYear").textContent =
    new Date().getFullYear();

  let currentSession = null;
  let paymentInProgress = false;

  function showMessage(text, type = "info") {
    messageBox.textContent = text;
    messageBox.className = "message";

    if (type === "error") {
      messageBox.classList.add("error");
    }

    if (type === "success") {
      messageBox.classList.add("success");
    }
  }

  function hideMessage() {
    messageBox.textContent = "";
    messageBox.className = "message hidden";
  }

  function money(value) {
    const number = Number(value ?? 0);

    if (!Number.isFinite(number)) {
      return "Amount unavailable";
    }

    return new Intl.NumberFormat("en-NG", {
      style: "currency",
      currency: "NGN",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(number);
  }

  function displayDate(value) {
    if (!value) return "Not specified";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return date.toLocaleDateString("en-NG", {
      day: "numeric",
      month: "short",
      year: "numeric"
    });
  }

  function addText(parent, tag, text, className = "") {
    const element = document.createElement(tag);

    element.textContent =
      text === null || text === undefined || text === ""
        ? "Not specified"
        : String(text);

    if (className) {
      element.className = className;
    }

    parent.appendChild(element);
    return element;
  }

  function addDetail(parent, label, value, total = false) {
    const row = document.createElement("div");
    row.className = "detail-row" + (total ? " total-row" : "");

    addText(row, "span", label);
    addText(row, "span", value);

    parent.appendChild(row);
  }

  async function getSession() {
    if (!db) {
      throw new Error(
        "FrostTech could not connect to Supabase. Check supabase.js."
      );
    }

    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    if (!data.session) {
      window.location.href =
        "customer-login.html?next=my-quotations.html";
      return null;
    }

    currentSession = data.session;
    return currentSession;
  }

  async function invokeFunction(name, body) {
    if (!currentSession?.access_token) {
      throw new Error("Your session has expired. Please log in again.");
    }

    const { data, error } = await db.functions.invoke(name, {
      body,
      headers: {
        Authorization: "Bearer " + currentSession.access_token
      }
    });

    if (error) {
      console.error(name + " failed:", error);
      throw new Error(
        "The quotation service could not complete the request. Please refresh and try again."
      );
    }

    if (!data || data.error || data.success === false) {
      throw new Error(
        data?.error || "The quotation service returned an unexpected response."
      );
    }

    return data;
  }

  async function handlePaystackReturn() {
    const params = new URLSearchParams(window.location.search);

    const reference =
      params.get("reference") ||
      params.get("trxref");

    if (!reference) return false;

    /*
      Remove the payment reference from the address bar after
      capturing it, so refreshing does not repeatedly verify it.
    */
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    showMessage("Checking your Paystack payment. Please wait.");

    try {
      const result = await invokeFunction(
        "verify-paystack-payment",
        { reference }
      );

      if (result.success === true && result.payment_status === "success") {
        showMessage(
          "Payment verified successfully. Your quotation details are now available.",
          "success"
        );
      } else if (result.success === true && result.status === "paid") {
        showMessage(
          "Payment verified successfully. Your quotation details are now available.",
          "success"
        );
      } else {
        showMessage(
          "We could not confirm a successful payment. Your full quotation remains locked. Refresh to check again.",
          "error"
        );
      }
    } catch (error) {
      console.error("Payment verification error:", error);

      showMessage(
        "We could not verify this payment yet. Your full quotation remains locked. Please refresh or contact FrostTech if you were charged.",
        "error"
      );
    }

    return true;
  }

  function renderLockedQuotation(quotation) {
    const card = document.createElement("article");
    card.className = "quotation-card";

    addText(
      card,
      "h3",
      quotation.quotation_number || "FrostTech Quotation"
    );

    addText(
      card,
      "div",
      "Quotation reference: " + quotation.id,
      "reference"
    );

    const status = addText(
      card,
      "span",
      "Payment required",
      "status"
    );

    status.setAttribute("aria-label", "Administration fee payment required");

    addDetail(
      card,
      "Quotation status",
      quotation.status || "Available"
    );

    addDetail(
      card,
      "Date issued",
      displayDate(quotation.created_at)
    );

    addDetail(
      card,
      "Valid until",
      displayDate(quotation.validity_date)
    );

    const feePanel = document.createElement("div");
    feePanel.className = "fee-panel";

    addText(feePanel, "strong", "Administration fee");

    addText(
      feePanel,
      "p",
      money(quotation.administration_fee),
      "fee-amount"
    );

    
    const payButton = document.createElement("button");
    payButton.type = "button";
    payButton.className = "primary-button";
    payButton.textContent = "Pay Administration Fee";

    payButton.addEventListener("click", async () => {
      await startPayment(quotation, payButton);
    });

    feePanel.appendChild(payButton);
    card.appendChild(feePanel);

    return card;
  }

  function renderUnlockedQuotation(quotation) {
    const card = document.createElement("article");
    card.className = "quotation-card";

    addText(
      card,
      "h3",
      quotation.quotation_number || "FrostTech Quotation"
    );

    addText(
      card,
      "div",
      "Quotation reference: " + quotation.id,
      "reference"
    );

    addText(card, "span", "Administration fee paid", "status status-paid");

    const details = document.createElement("div");
    details.className = "details";

    addDetail(
      details,
      "Product / Service",
      quotation.product_description
    );

    addDetail(
      details,
      "Quantity",
      quotation.quantity
    );

    addDetail(
      details,
      "Unit price",
      money(quotation.unit_price)
    );

    addDetail(
      details,
      "Subtotal",
      money(quotation.subtotal)
    );

    addDetail(
      details,
      "Additional charges",
      money(quotation.additional_charges)
    );

    addDetail(
      details,
      "Discount",
      money(quotation.discount)
    );

    addDetail(
      details,
      "Delivery",
      money(quotation.delivery_cost)
    );

    addDetail(
      details,
      "Total quotation amount",
      money(quotation.total_amount),
      true
    );

    addDetail(
      details,
      "Valid until",
      displayDate(quotation.validity_date)
    );

    addDetail(
      details,
      "Date issued",
      displayDate(quotation.created_at)
    );

    addDetail(
      details,
      "Administration fee paid",
      money(quotation.administration_fee)
    );

    card.appendChild(details);
    return card;
  }

  async function loadQuotations() {
    hideMessage();

    refreshButton.disabled = true;
    container.replaceChildren();

    addText(
      container,
      "div",
      "Loading your quotations...",
      "notice"
    );

    try {
      await getSession();

      if (!currentSession) return;

      await handlePaystackReturn();

      const result = await invokeFunction(
        "get-customer-quotations",
        {}
      );

      if (!Array.isArray(result.quotations)) {
        throw new Error("The quotation service returned an invalid response.");
      }

      container.replaceChildren();

      if (result.quotations.length === 0) {
        addText(
          container,
          "div",
          "You do not have any quotations available yet.",
          "notice"
        );

        return;
      }

      for (const quotation of result.quotations) {
        /*
          Never treat missing or false unlock status as paid.
          The server function decides whether full details can be returned.
        */
        if (quotation.quotation_details_unlocked === true) {
          container.appendChild(
            renderUnlockedQuotation(quotation)
          );
        } else {
          container.appendChild(
            renderLockedQuotation(quotation)
          );
        }
      }
    } catch (error) {
      console.error("Loading quotations failed:", error);

      container.replaceChildren();

      addText(
        container,
        "div",
        error.message || "Unable to load your quotations.",
        "notice"
      );

      showMessage(
        "We could not load your quotations. Please refresh the page or log in again.",
        "error"
      );
    } finally {
      refreshButton.disabled = false;
    }
  }

  async function startPayment(quotation, button) {
    if (paymentInProgress) return;

    paymentInProgress = true;
    button.disabled = true;
    button.textContent = "Preparing secure payment...";

    try {
      await getSession();

      if (!currentSession) return;

      const result = await invokeFunction(
        "initialize-paystack-payment",
        {
          quotation_id: quotation.id
        }
      );

      if (
        result.success !== true ||
        !result.authorization_url
      ) {
        throw new Error(
          result.error || "Paystack could not initialize the payment."
        );
      }

      /*
        Do not charge the customer from this page directly.
        Paystack handles the payment on its secure hosted page.
      */
      window.location.assign(result.authorization_url);
    } catch (error) {
      console.error("Payment initialization failed:", error);

      showMessage(
        error.message || "Unable to start payment. Please try again.",
        "error"
      );

      button.disabled = false;
      button.textContent = "Pay Administration Fee";
      paymentInProgress = false;
    }
  }

  refreshButton.addEventListener("click", loadQuotations);

  signOutButton.addEventListener("click", async () => {
    signOutButton.disabled = true;

    try {
      const { error } = await db.auth.signOut();

      if (error) throw error;

      window.location.href = "customer-login.html";
    } catch (error) {
      console.error("Sign out failed:", error);

      showMessage(
        "Unable to sign out. Please try again.",
        "error"
      );

      signOutButton.disabled = false;
    }
  });

  loadQuotations();
})();
</script>

</body>
</html>
