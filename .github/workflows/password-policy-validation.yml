name: Password Policy Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "password-policy.js"
      - "tests/password-policy.test.cjs"
      - "tests/password-policy-integration.test.cjs"
      - "tests/password-policy-dom.test.cjs"
      - ".github/workflows/password-policy-validation.yml"
  push:
    branches: [security/password-policy-hardening]
    paths:
      - "*.html"
      - "password-policy.js"
      - "tests/password-policy.test.cjs"
      - "tests/password-policy-integration.test.cjs"
      - "tests/password-policy-dom.test.cjs"
      - ".github/workflows/password-policy-validation.yml"

jobs:
  password-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Run password policy regression tests
        run: node --test tests/password-policy.test.cjs tests/password-policy-integration.test.cjs tests/password-policy-dom.test.cjs
